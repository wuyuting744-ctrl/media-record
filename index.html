                        <span><i class="fa-solid fa-triangle-exclamation" style="color:#d48806;margin-right:5px;font-size:0.85rem"></i>待处理预警</span>
                        <span class="dash-card-subtitle">点击数字可一键筛选相关作品</span>
                    </div>
                    <div class="dash-alert-items" id="dashAlertItems"></div>
                </div>
            </div>
        </div>

        <!-- 月度详情 -->
        <div class="grid-stack-item" id="gsi-monthly" gs-w="12" gs-h="14" gs-min-h="6" gs-min-w="5">
            <div class="grid-stack-item-content">
                <div class="dash-card" data-mid="monthly">
                    <div class="dash-card-title">月度详情
                        <div style="display:flex;gap:5px;align-items:center">
                            <select id="dashMonthYearSel" class="mcal-sel" onchange="onDashMonthChange()"></select>
                            <select id="dashMonthMonthSel" class="mcal-sel" onchange="onDashMonthChange()"></select>
                        </div>
                    </div>
                    <div class="dash-month-cats" id="dashMonthCats" style="margin-bottom:16px"></div>
                    <div class="dash-detail-grid" id="dashDetailCards"></div>
                </div>
            </div>
        </div>

        <!-- 各状态·分类别统计 -->
        <div class="grid-stack-item" id="gsi-status" gs-w="5" gs-h="14" gs-min-h="3" gs-min-w="3">
            <div class="grid-stack-item-content">
                <div class="dash-card" data-mid="status">
                    <div class="dash-card-title">各状态 · 分类别统计</div>
                    <div id="dashStatusMatrix"></div>
                </div>
            </div>
        </div>

        <!-- 各类最高评分 -->
        <div class="grid-stack-item" id="gsi-toprated" gs-w="7" gs-h="14" gs-min-h="6" gs-min-w="3">
            <div class="grid-stack-item-content">
                <div class="dash-card" id="dashTopRated" data-mid="toprated"></div>
            </div>
        </div>

        <!-- 评分分布 -->
        <div class="grid-stack-item" id="gsi-rating" gs-w="12" gs-h="10" gs-min-h="5" gs-min-w="4">
            <div class="grid-stack-item-content">
                <div class="dash-card" data-mid="rating">
                    <div class="dash-card-title">评分分布</div>
                    <div class="rating-canvas-wrap"><canvas id="chartRating"></canvas></div>
                </div>
            </div>
        </div>

        <!-- 月度活跃日历 -->
        <div class="grid-stack-item" id="gsi-mcal" gs-w="12" gs-h="18" gs-min-h="8" gs-min-w="5">
            <div class="grid-stack-item-content">
                <div class="dash-card" data-mid="mcal">
                    <div class="dash-card-title">月度活跃日历
                        <div class="mcal-nav-row">
                            <button class="mcal-nav-btn" onclick="changeDashCalMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                            <select id="dashCalYearSel" class="mcal-sel" onchange="onDashCalDropdown()"></select>
                            <select id="dashCalMonthSel" class="mcal-sel" onchange="onDashCalDropdown()"></select>
                            <button class="mcal-nav-btn" onclick="changeDashCalMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
                        </div>
                    </div>
                    <div class="mcal-body-layout">
                        <div class="mcal-body-left"><div class="mcal-grid" id="dashMonthCalGrid"></div></div>
                        <div class="mcal-body-right">
                            <div class="mcal-summary" id="dashCalSummary"></div>
                            <div class="mcal-legend-row" id="dashCalLegend"></div>
                        </div>
                    </div>
                    <div id="mcalDayPanel" style="display:none;margin-top:12px;padding:10px 14px;background:var(--bg);border-radius:var(--radius-sm);border:1px solid var(--border)">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                            <span id="mcalDayPanelTitle" style="font-size:0.85rem;font-weight:600;color:var(--text)"></span>
                            <button onclick="document.getElementById('mcalDayPanel').style.display='none'" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:1rem;padding:0 4px;line-height:1">×</button>
                        </div>
                        <div id="mcalDayPanelBody"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 观影趋势 -->
        <div class="grid-stack-item" id="gsi-trend" gs-w="12" gs-h="10" gs-min-h="5" gs-min-w="4">
            <div class="grid-stack-item-content">
                <div class="dash-card" data-mid="trend">
                    <div class="dash-card-title">观影趋势</div>
                    <canvas id="chartTrend"></canvas>
                    <div id="trendSliderWrap" style="display:none;padding:6px 36px 2px">
                        <input type="range" id="trendSlider" min="0" max="0" value="0" style="width:100%;cursor:pointer">
                        <div style="display:flex;justify-content:space-between;font-size:0.68rem;color:var(--text-muted);margin-top:2px">
                            <span id="trendSliderStart"></span><span id="trendSliderEnd"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 题材偏好 -->
        <div class="grid-stack-item" id="gsi-radar" gs-w="5" gs-h="16" gs-min-h="6" gs-min-w="3">
            <div class="grid-stack-item-content">
                <div class="dash-card" data-mid="radar">
                    <div class="dash-card-title">题材偏好</div>
                    <canvas id="chartGenreRadar" style="cursor:crosshair;display:block;margin:0 auto"></canvas>
                    <div id="genreRadarEmpty" style="display:none;text-align:center;color:var(--text-muted);font-size:0.85rem;padding:16px 0">暂无题材数据</div>
                </div>
            </div>
        </div>

        <!-- 关系图谱 -->
        <div class="grid-stack-item" id="gsi-network" gs-w="7" gs-h="16" gs-min-h="6" gs-min-w="3">
            <div class="grid-stack-item-content">
                <div class="dash-card" data-mid="network">
                    <div class="dash-card-title">关系图谱
                        <span class="dash-card-subtitle" style="font-size:0.60rem">节点代表作品，连线代表共同标签 · 点击节点筛选</span>
                    </div>
                    <canvas id="chartNetwork" class="net-canvas"></canvas>
                    <div class="net-legend">
                        <span class="net-legend-item"><span class="net-legend-line" style="background:#d8b494"></span>共同标签</span>
                        <span class="net-legend-item" style="font-size:0.58rem;color:var(--text-muted)">节点颜色代表作品类别 · 悬停查看详情</span>
                    </div>
                    <div class="net-info" id="networkInfo" style="display:none">
                        <div class="net-info-title" id="networkInfoTitle"></div>
                        <div class="net-info-meta" id="networkInfoMeta"></div>
                        <button class="btn btn-primary net-info-btn" onclick="filterByNetworkSel()"><i class="fa-solid fa-filter"></i> 筛选相关</button>
                        <button class="btn btn-secondary net-info-btn" onclick="clearNetworkSel()"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>
            </div>
        </div>

    </div><!-- /#dashGrid -->
    <!-- 月度封面日历（导出用，不显示在看板） -->
        <div class="dash-card" id="photoCalCard" style="display:none">
            <div class="photo-cal-header">
                <div class="photo-cal-nav">
                    <button class="mcal-nav-btn" onclick="changePhotoCalMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                    <span class="photo-cal-month-lbl" id="photoCalMonthLbl"></span>
                    <button class="mcal-nav-btn" onclick="changePhotoCalMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
                <div class="dash-card-title" style="margin:0;font-size:0.9rem">月度封面日历</div>
                <button class="btn btn-secondary" id="photoCalExportBtn" onclick="exportCalendarImage()" style="font-size:0.72rem;padding:5px 12px">
                    📷 导出图片
                </button>
            </div>
            <div class="photo-cal-grid" id="photoCalGrid"></div>
            <div class="photo-cal-stats" id="photoCalStats"></div>
            <div id="photoCalDayPanel" style="display:none;margin-top:10px;padding:10px 14px;background:var(--bg);border-radius:var(--radius-sm);border:1px solid var(--border)">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                    <span id="photoCalDayTitle" style="font-size:0.85rem;font-weight:600;color:var(--text)"></span>
                    <button onclick="document.getElementById('photoCalDayPanel').style.display='none'" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:1rem;padding:0 4px;line-height:1">×</button>
                </div>
                <div id="photoCalDayBody"></div>
            </div>
        </div>
    </div><!-- /#dashboardView -->
</main>

<button id="dashResetLayout" onclick="resetDashLayout()" title="重置布局">↺</button>
<button class="fab" onclick="openAddModal()" title="添加记录"><i class="fa-solid fa-plus"></i></button>

<!-- ADD / EDIT MODAL -->
<div class="modal-backdrop" id="formModal">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title" id="formTitle">添加记录</div>
            <button class="modal-close" onclick="closeFormModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <form id="recordForm" onsubmit="saveRecord(event)">
            <div class="form-group">
                <label>标题 <span class="req">*</span></label>
                <input type="text" class="form-control" id="fTitle" placeholder="请输入作品标题" required autocomplete="off">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>类别 <span class="req">*</span></label>
                    <select class="form-control" id="fCat" required>
                        <option value="">请选择类别</option>

<script>
/* ============================================================  CONSTANTS  */
const STORAGE_KEY       = 'media_records_v1';
const CUSTOM_GENRES_KEY = 'media_custom_genres';
const IDB_NAME  = 'media_images_db';
const IDB_STORE = 'images';
let   imgCache  = {}; // id → base64，从 IDB 加载到内存供同步渲染使用

const CATEGORIES = ['电影','电视剧','综艺','短剧','小说','文章'];
const CAT_CLASS  = { '电影':'movie','电视剧':'tv','综艺':'variety','短剧':'shortdrama','小说':'novel','文章':'article' };
const CAT_ICON   = { '电影':'fa-film','电视剧':'fa-tv','综艺':'fa-star','短剧':'fa-mobile-screen','小说':'fa-book','文章':'fa-newspaper' };
const STA_CLASS  = { '想看':'want','在看':'watching','看过':'done' };

const PREDEFINED_GENRES = [
    '爱情','喜剧','悬疑','惊悚','科幻','动作','动画','纪录片',
    '历史','奇幻','战争','家庭','青春','犯罪','恐怖','传记',
    '音乐','冒险','体育','政治','生活','心理'
];
const PREDEFINED_COMPANIONS = [
    {val:'👧', label:'自己'},
    {val:'👨', label:'daddy'},
    {val:'👩', label:'咪咪'},
    {val:'💑', label:'YANG'},
    {val:'🏠', label:'家'},
    {val:'👵', label:'外婆'},
];
const CUSTOM_COMPANIONS_KEY = 'media_custom_companions';

const MONTH_ZH = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
const DAY_ZH   = ['日','一','二','三','四','五','六'];

/* ============================================================  IDB IMAGE STORAGE  */
function openIDB() {
    return new Promise((res, rej) => {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = e => e.target.result.createObjectStore(IDB_STORE);
        req.onsuccess = e => res(e.target.result);
        req.onerror   = e => rej(e.target.error);
    });
}
function saveImageToIDB(id, base64) {
    openIDB().then(db => {
        db.transaction(IDB_STORE, 'readwrite').objectStore(IDB_STORE).put(base64, id);
    }).catch(() => {});
}
function deleteImageFromIDB(id) {
    openIDB().then(db => {
        db.transaction(IDB_STORE, 'readwrite').objectStore(IDB_STORE).delete(id);
    }).catch(() => {});
    delete imgCache[id];
}
function loadImagesFromIDB() {
    return openIDB().then(db => new Promise(res => {
        const req = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).openCursor();
        req.onsuccess = e => {
            const c = e.target.result;
            if (c) { imgCache[c.key] = c.value; c.continue(); } else res();
        };
        req.onerror = () => res();
    })).catch(() => {});
}

/* ============================================================  DATA  */
function loadRecords() {
    try {
        const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        let needsSave = false;
        const result = raw.map(r => {
            if (!r.watchDates) {
                const sd = r.startDate || r.date;
                r.watchDates = sd ? [{ start: sd, end: r.endDate || '' }] : [];
            }
            if (!r.checkIns) r.checkIns = [];
            // Migrate: move base64 images out of localStorage into IndexedDB
            if (r.coverImg && r.coverImg.startsWith('data:')) {
                imgCache[r.id] = r.coverImg;
                saveImageToIDB(r.id, r.coverImg);
                r.coverImg = '__idb__';
                needsSave = true;
            }
            return r;
        });
        if (needsSave) {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(result)); } catch {}
        }
        return result;
    } catch { return []; }
}
function saveRecords(arr) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); }
    catch (e) {
        if (e.name === 'QuotaExceededError') showToast('存储空间已满，图片已自动迁移至IndexedDB，请重新保存', 'error');
        else throw e;
    }
}
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

/* ============================================================  STATE  */
let records        = loadRecords();
let currentView    = 'grid';
let editingId      = null;
let pendingDelId   = null;
let ratingTouched  = false;
let selectedGenres = [];
let selectedCompanions = [];
let customGenres      = (() => { try { return JSON.parse(localStorage.getItem(CUSTOM_GENRES_KEY)||'[]'); } catch { return []; } })();
let customCompanions  = (() => { try { return JSON.parse(localStorage.getItem(CUSTOM_COMPANIONS_KEY)||'[]'); } catch { return []; } })();
let calDateMap        = {};   // module-level: date → [{r, type, note}]
let filterGenreValue  = '';   // selected genre for toolbar filter
let currentImgBase64  = '';   // image being edited in current modal session
let sortField  = '';          // '' = default (insertion order)
let sortDir    = 'desc';      // 'asc' | 'desc'
let groupField = '';          // '' = no grouping
let alertFilter = null;       // null = inactive, Set<id> = filter to these records
let alertFilterType = '';     // 'backlog' | 'stalled'
let _calRecs = null;          // filtered records for calendar view (null = use all records)

const SORT_OPTS = [
    { val:'',         label:'默认顺序' },
    { val:'title',    label:'标题' },
    { val:'rating',   label:'评分' },
    { val:'date',     label:'观看日期' },
    { val:'category', label:'类别' },
    { val:'status',   label:'状态' },
];
const GROUP_OPTS = [
    { val:'',         label:'不分组' },
    { val:'category', label:'按类别' },
    { val:'status',   label:'按状态' },
    { val:'rating',   label:'按评分区间' },
];

const _now = new Date();
let calYear  = _now.getFullYear();
let calMonth = _now.getMonth();

/* ============================================================  INIT  */
function populateGenreFilter() {
    const sel = document.getElementById('filterGenre');
    if (!sel) return;
    const cur = sel.value;
    const all = [...PREDEFINED_GENRES, ...customGenres.filter(g => !PREDEFINED_GENRES.includes(g))];
    sel.innerHTML = '<option value="">全部题材</option>' +
        all.map(g => `<option value="${esc(g)}">${esc(g)}</option>`).join('');
    if (cur && all.includes(cur)) sel.value = cur;
}

function getAllGenreOptions() {
    return [...PREDEFINED_GENRES, ...customGenres.filter(g => !PREDEFINED_GENRES.includes(g))];
}

function renderGenreFilterOpts(q) {
    const all      = getAllGenreOptions();
    const filtered = q ? all.filter(g => g.includes(q)) : all;
    const dd       = document.getElementById('genreFilterDropdown');
    let html = `<div class="ss-opt${filterGenreValue===''?' ss-selected':''}" data-val="" onclick="selectGenreOpt(this)">全部题材</div>`;
    html += filtered.length
        ? filtered.map(g => `<div class="ss-opt${filterGenreValue===g?' ss-selected':''}" data-val="${esc(g)}" onclick="selectGenreOpt(this)">${esc(g)}</div>`).join('')
        : '<div class="ss-empty">无匹配</div>';
    dd.innerHTML = html;
}

function selectGenreOpt(el) {
    filterGenreValue = el.dataset.val;
    document.getElementById('filterGenreInput').value = filterGenreValue;
    document.getElementById('genreFilterWrap').classList.remove('open');
    applyFilters();
}

function setupGenreFilter() {
    const wrap  = document.getElementById('genreFilterWrap');
    const input = document.getElementById('filterGenreInput');

    input.addEventListener('focus', () => {
        renderGenreFilterOpts(input.value);
        wrap.classList.add('open');
    });
    input.addEventListener('input', () => {
        filterGenreValue = '';
        renderGenreFilterOpts(input.value);
        wrap.classList.add('open');
        applyFilters();
    });
    document.addEventListener('click', e => {
        if (!wrap.contains(e.target)) {
            wrap.classList.remove('open');
            // Restore display to selected value
            input.value = filterGenreValue;
        }
    });
    input.addEventListener('keydown', e => {
        if (e.key === 'Escape') { wrap.classList.remove('open'); input.value = filterGenreValue; }
    });
}

async function init() {
    await loadImagesFromIDB(); // 从 IDB 加载所有图片到 imgCache，再渲染
    renderStats(); applyFilters(); setupGenreSelector(); setupGenreFilter(); renderCompanionFilter();
}

/* ============================================================  STATS  */
function renderStats() {
    const counts = CATEGORIES.map(c => records.filter(r => r.category === c).length);
    document.getElementById('statsGrid').innerHTML =
        `<div class="stat-card"><div class="stat-number">${records.length}</div><div class="stat-label">总记录</div></div>` +
        CATEGORIES.map((c, i) =>
            `<div class="stat-card"><div class="stat-number">${counts[i]}</div><div class="stat-label">${c}</div></div>`
        ).join('');
}

/* ============================================================  FILTERS  */
function applyFilters() {
    const q         = document.getElementById('searchInput').value.trim().toLowerCase();
    const cat       = document.getElementById('filterCat').value;
    const status    = document.getElementById('filterStatus').value;
    const companion = document.getElementById('filterCompanion').value;
    const date      = document.getElementById('filterDate').value;

    const filtered = records.filter(r => {
        if (q && !r.title.toLowerCase().includes(q) && !(r.notes||'').toLowerCase().includes(q)) return false;
        if (cat       && r.category !== cat)                             return false;
        if (status    && r.status   !== status)                          return false;
        if (companion && !(r.companions||[]).includes(companion))         return false;
        if (filterGenreValue && !(r.genres||[]).some(g => g.includes(filterGenreValue))) return false;
        if (date) {
            const inSeg = (r.watchDates||[]).some(seg => {
                if (!seg.start) return false;
                if (seg.start === date) return true;
                if (seg.end === date)   return true;
                if (seg.end && seg.start <= date && date <= seg.end) return true;
                return false;
            });
            const inCheckIn = (r.checkIns||[]).some(ci => ci.date === date);
            if (!inSeg && !inCheckIn) return false;
        }
        return true;
    });

    // Apply alert filter if active
    const alertFiltered = alertFilter !== null ? filtered.filter(r => alertFilter.has(r.id)) : filtered;

    const hasFilter = q || cat || status || companion || filterGenreValue || date || alertFilter;
    document.getElementById('resultInfo').textContent = hasFilter
        ? `找到 ${alertFiltered.length} 条 / 共 ${records.length} 条`
        : (records.length ? `共 ${records.length} 条记录` : '');

    _calRecs = alertFiltered; // keep calendar in sync with filters
    if (currentView === 'grid') renderCards(alertFiltered);
    else renderCalendar();
}

function clearFilters() {
    ['searchInput','filterCat','filterStatus','filterCompanion','filterDate'].forEach(id => { document.getElementById(id).value=''; });
    filterGenreValue = '';
    document.getElementById('filterGenreInput').value = '';
    document.getElementById('genreFilterWrap').classList.remove('open');
    alertFilter = null; alertFilterType = '';
    document.getElementById('alertFilterBanner').style.display = 'none';
    applyFilters();
}

/* ============================================================  SORT & GROUP  */
function sortRecords(arr) {
    if (!sortField) {
        // Default: first watch date (earliest segment start) desc; fall back to createdAt
        const key = r => {
            const segs = (r.watchDates || []).filter(s => s.start);
            if (segs.length) {
                const earliest = segs.map(s => s.start).sort()[0];
                return new Date(earliest + 'T00:00:00').getTime();
            }
            return r.createdAt || 0;
        };
        return [...arr].sort((a, b) => key(b) - key(a)); // newest first
    }
    const statusOrd = {'想看':0,'在看':1,'看过':2};
    return [...arr].sort((a, b) => {
        let va, vb;
        if      (sortField === 'title')    { va = a.title||'';  vb = b.title||''; }
        else if (sortField === 'rating')   { va = a.rating||0;  vb = b.rating||0; }
        else if (sortField === 'date')     { va = (a.watchDates||[])[0]?.start || a.date || ''; vb = (b.watchDates||[])[0]?.start || b.date || ''; }
        else if (sortField === 'category') { va = CATEGORIES.indexOf(a.category); vb = CATEGORIES.indexOf(b.category); }
        else if (sortField === 'status')   { va = statusOrd[a.status]??0; vb = statusOrd[b.status]??0; }
        if (va < vb) return sortDir === 'asc' ? -1 : 1;
        if (va > vb) return sortDir === 'asc' ?  1 : -1;
        return 0;
    });
}

function groupKey(r) {
    if (groupField === 'category') return r.category || '未分类';
    if (groupField === 'status')   return r.status   || '未知';
    if (groupField === 'rating') {
        const rt = r.rating || 0;
        if (rt === 0)  return '未评分';
        if (rt < 4)    return '1–3 分';
        if (rt < 6)    return '4–5 分';
        if (rt < 8)    return '6–7 分';
        return '8–10 分';
    }
    return '';
}

function groupOrder() {
    if (groupField === 'category') return [...CATEGORIES];
    if (groupField === 'status')   return ['想看','在看','看过'];
    if (groupField === 'rating')   return ['8–10 分','6–7 分','4–5 分','1–3 分','未评分'];
    return [];
}

/* Panel render */
function renderSortPanel() {
    let html = `<div class="action-panel-title">排序方式</div>`;
    SORT_OPTS.forEach(o => {
        html += `<div class="action-opt${sortField===o.val?' selected':''}" onclick="setSortField('${o.val}')">
            <span class="opt-chk">${sortField===o.val?'<i class="fa-solid fa-check"></i>':''}</span>${esc(o.label)}
        </div>`;
    });
    html += `<div class="action-divider"></div>
    <div class="sort-dir-row">
        <button class="sort-dir-btn${sortDir==='asc'?' active':''}" onclick="setSortDir('asc')">↑ 升序</button>
        <button class="sort-dir-btn${sortDir==='desc'?' active':''}" onclick="setSortDir('desc')">↓ 降序</button>
    </div>`;
    document.getElementById('sortPanel').innerHTML = html;
}

function renderGroupPanel() {
    let html = `<div class="action-panel-title">分组方式</div>`;
    GROUP_OPTS.forEach(o => {
        html += `<div class="action-opt${groupField===o.val?' selected':''}" onclick="setGroupField('${o.val}')">
            <span class="opt-chk">${groupField===o.val?'<i class="fa-solid fa-check"></i>':''}</span>${esc(o.label)}
        </div>`;
    });
    document.getElementById('groupPanel').innerHTML = html;

/* ============================================================  HELPERS  */
function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function pad(n) { return String(n).padStart(2,'0'); }

function toggleNotes(btn) {
    const notes = btn.previousElementSibling;
    const expanded = notes.classList.toggle('expanded');
    btn.innerHTML = expanded ? '<i class="fa-solid fa-chevron-up"></i> 收起' : '<i class="fa-solid fa-chevron-down"></i> 展开';
}

function starsHTML(rating) {
    if (!rating) return '';
    const full=Math.floor(rating/2), half=(rating%2)>=1?1:0, empty=5-full-half;
    return '<i class="fa-solid fa-star"></i>'.repeat(full)
         + (half?'<i class="fa-solid fa-star-half-stroke"></i>':'')
         + '<i class="fa-regular fa-star"></i>'.repeat(empty);
}

/* ============================================================  CARDS  */
function cardHTML(r) {
    const genres      = (r.genres||[]).map(g=>`<span class="genre-tag">${esc(g)}</span>`).join('');
    const rating      = r.rating>0 ? `<div class="card-rating"><span class="stars">${starsHTML(r.rating)}</span><span class="rating-num">${r.rating}</span></div>` : '';
    const thumbHTML   = imgCache[r.id] ? `<img class="card-thumb" src="${imgCache[r.id]}" alt="封面" loading="lazy">` : '';

    // Link only — dates not shown in cards
    const linkRow = r.link ? `<div class="card-dates"><a href="${esc(r.link)}" target="_blank" rel="noopener" class="card-link" onclick="event.stopPropagation()"><i class="fa-solid fa-arrow-up-right-from-square"></i> 链接</a></div>` : '';

    const companions    = (r.companions||[]);
    const companionRow  = companions.length ? `<div class="card-companions"><i class="fa-solid fa-user-group"></i>${companions.map(c=>`<span class="comp-tag">${esc(c)}</span>`).join('')}</div>` : '';

    const notes = r.notes ? `
        <div class="card-notes">${esc(r.notes)}</div>
        <button type="button" class="notes-toggle" onclick="toggleNotes(this);event.stopPropagation()">
            <i class="fa-solid fa-chevron-down"></i> 展开
        </button>` : '';

    const isSel = manageMode && selectedIds.has(r.id);
    const manageAttrs = manageMode
        ? `draggable="true" onclick="toggleSelect('${r.id}')"
           ondragstart="onDragStart(event,'${r.id}')"
           ondragover="onDragOver(event,'${r.id}')"
           ondrop="onDrop(event,'${r.id}')"
           ondragend="onDragEnd(event,'${r.id}')"`
        : `onclick="openDetailModal('${r.id}')"`;

    return `
    <div class="card${isSel?' selected':''}" id="card-${r.id}" data-id="${r.id}" ${manageAttrs}>
        <div class="card-drag-handle"><i class="fa-solid fa-grip-vertical"></i></div>
        <div class="card-sel-circle">${isSel?'<i class="fa-solid fa-check"></i>':''}</div>
        <div class="card-header">
            <div class="card-title">${esc(r.title)}</div>
            <span class="status-badge status-${STA_CLASS[r.status]||'done'}">${r.status}</span>
        </div>
        ${thumbHTML}
        <div class="card-meta">
            <span class="tag tag-${CAT_CLASS[r.category]||'movie'}">${r.category}</span>
            ${genres}
        </div>
        ${rating}${linkRow}${companionRow}${notes}
    </div>`;
}

function applyNotesClamp(container) {
    container.querySelectorAll('.card-notes').forEach(el => {
        const t = el.nextElementSibling;
        if (t && t.classList.contains('notes-toggle'))
            t.style.display = el.scrollHeight <= el.clientHeight + 2 ? 'none' : '';
    });
}

function renderCards(filtered) {
    const grid = document.getElementById('cardsGrid');
    if (!filtered.length) {
        const hasF = document.getElementById('searchInput').value
            ||document.getElementById('filterCat').value
            ||document.getElementById('filterStatus').value
            ||document.getElementById('filterDate').value;
        grid.className = '';
        grid.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1">
                <i class="fa-solid ${hasF?'fa-filter-circle-xmark':'fa-book-open-reader'}"></i>
                <h3>${hasF?'没有符合条件的记录':'还没有记录哦'}</h3>
                <p>${hasF?'试试调整或清除筛选条件':'点击「添加记录」，开始记录你的影视文学之旅！'}</p>
                ${!hasF?'<button class="btn btn-primary" onclick="openAddModal()"><i class="fa-solid fa-plus"></i> 添加第一条</button>':''}
            </div>`;
        return;
    }

    const sorted = sortRecords(filtered);

    if (manageMode) {
        // Manage mode: flat grid, no grouping
        grid.className = 'cards-grid manage-mode';
        grid.innerHTML  = sorted.map(cardHTML).join('');
        applyNotesClamp(grid);
        return;
    }

    if (groupField) {
        // Grouped view
        grid.className = '';
        const groups = {};
        sorted.forEach(r => {
            const k = groupKey(r);
            if (!groups[k]) groups[k] = [];
            groups[k].push(r);
        });
        const order = groupOrder();
        const keys  = [...new Set([...order, ...Object.keys(groups)])].filter(k => groups[k]);
        grid.innerHTML = keys.map(key => `
            <div class="group-section">
                <div class="group-header">
                    <span class="group-label">${esc(key)}</span>
                    <span class="group-count">${groups[key].length} 条</span>
                    <span class="group-line"></span>
                </div>
                <div class="cards-grid">${groups[key].map(cardHTML).join('')}</div>
            </div>`).join('');
    } else {
        // Normal flat grid
        grid.className  = 'cards-grid';
        grid.innerHTML  = sorted.map(cardHTML).join('');
    }
    applyNotesClamp(grid);
}

/* ============================================================  CALENDAR  */
function switchView(view) {
    currentView = view;
    const viewMap = { grid:'gridView', calendar:'calendarView', dashboard:'dashboardView' };
    Object.entries(viewMap).forEach(([v, id]) => {
        const el = document.getElementById(id);
        if (v === view) {
            el.style.display = '';
            el.classList.remove('view-enter');
            void el.offsetWidth; // trigger reflow to restart animation
            el.classList.add('view-enter');
        } else {
            el.style.display = 'none';
            el.classList.remove('view-enter');
        }
    });
    document.getElementById('btnGrid').classList.toggle('active', view==='grid');
    document.getElementById('btnCal').classList.toggle('active',  view==='calendar');
    document.getElementById('btnDash').classList.toggle('active', view==='dashboard');

    const isGrid     = view === 'grid';
    const isCal      = view === 'calendar';
    const showFilter = isGrid || isCal;   // 工具栏在画册和日历视图均显示

    const tb = document.getElementById('toolbar');
    if (tb) tb.style.display = showFilter ? '' : 'none';
    const rb = document.getElementById('resultBar');
    if (rb) rb.style.display = isGrid ? '' : 'none';
    const ab = document.getElementById('alertFilterBanner');
    if (ab && !isGrid) ab.style.display = 'none';
    // 管理按钮仅画册视图可用
    const mgBtn = document.getElementById('manageBtn');
    if (mgBtn) mgBtn.style.display = isGrid ? '' : 'none';
    // 导出按钮仅日历视图显示
    const calExBtn = document.getElementById('calExportBtn');
    if (calExBtn) calExBtn.style.display = isCal ? '' : 'none';
    // 离开画册视图时退出管理模式
    if (!isGrid && manageMode) exitManage();

    if (view==='calendar')  renderCalendar();
    else if (view==='dashboard') {
        // 1. Init gridstack first (positions modules with correct sizes)
        initDashGrid();
        // 2. Wait two animation frames so the browser finishes CSS layout,
        //    THEN render charts — ensures canvas reads correct clientWidth
        requestAnimationFrame(() => requestAnimationFrame(() => {
            renderDashboard();
        }));
    }
    else applyFilters();
}

function changeMonth(d) {
    calMonth += d;
    if (calMonth < 0)  { calMonth=11; calYear--; }
    if (calMonth > 11) { calMonth=0;  calYear++; }
    document.getElementById('calDayDetail').style.display = 'none';
    renderCalendar();
}

function buildCalDateMap() {
    calDateMap = {};
    const add = (date, r, type, note) => {
        if (!date) return;
        if (!calDateMap[date]) calDateMap[date] = [];
        calDateMap[date].push({ r, type, note: note||'' });
    };
    const recs = _calRecs || records; // respect active filter
    recs.forEach(r => {
        const segs = (r.watchDates||[]).filter(s => s.start);
        if (segs.length) {
            // Sort by start date to determine global start/end
            segs.sort((a, b) => a.start < b.start ? -1 : a.start > b.start ? 1 : 0);
            const globalStart = segs[0].start;
            const lastSeg     = segs[segs.length - 1];
            const globalEnd   = lastSeg.end || lastSeg.start;

            segs.forEach(seg => {
                const segEnd = seg.end || seg.start;
                let cur = new Date(seg.start + 'T00:00:00');
                const endD = new Date(segEnd + 'T00:00:00');
                while (cur <= endD) {
                    const ds = `${cur.getFullYear()}-${pad(cur.getMonth()+1)}-${pad(cur.getDate())}`;
                    // Only one global start and one global end per record
                    // 在看状态：最后一天标记为 range，不标记完结
                    if (ds === globalStart)                                add(ds, r, 'start');
                    else if (ds === globalEnd && r.status !== '在看')     add(ds, r, 'end');
                    else                                                   add(ds, r, 'range');
                    cur.setDate(cur.getDate() + 1);
                }
            });
        }
        (r.checkIns||[]).forEach(ci => { if(ci.date) add(ci.date, r, 'checkIn', ci.note); });
    });
}

function renderCalendar() {
    document.getElementById('calTitle').textContent = `${calYear} 年 ${MONTH_ZH[calMonth]}`;
    buildCalDateMap();

    const td = new Date();
    const todayStr = `${td.getFullYear()}-${pad(td.getMonth()+1)}-${pad(td.getDate())}`;

    const firstWD = new Date(calYear, calMonth, 1).getDay();
    const dim     = new Date(calYear, calMonth+1, 0).getDate();
    const prevDim = new Date(calYear, calMonth, 0).getDate();

    const headers = DAY_ZH.map(d=>`<div class="cal-day-header">${d}</div>`).join('');
    let cells = '';

    for (let i=firstWD-1; i>=0; i--) {
        cells += `<div class="cal-cell other-month"><div class="cal-date-num">${prevDim-i}</div></div>`;
    }

    for (let d=1; d<=dim; d++) {
        const ds      = `${calYear}-${pad(calMonth+1)}-${pad(d)}`;
        const entries = calDateMap[ds] || [];
        const isToday = ds === todayStr;
        const cls = ['cal-cell', isToday?'today':''].filter(Boolean).join(' ');

        const MAX   = 3;
        const visible = entries.filter(e => e.type !== 'checkIn'); // 打卡不在格子里显示
        const shown = visible.slice(0, MAX);
        const extra = visible.length - MAX;
        const itemsHTML = shown.map(e => {
            const cc  = CAT_CLASS[e.r.category] || 'movie';
            const ic  = CAT_ICON[e.r.category]  || 'fa-film';
            const typeCls = e.type === 'end' ? ' type-end' : e.type === 'checkIn' ? ' type-checkin' : e.type === 'range' ? ' type-range' : '';
            const prefix  = e.type === 'end' ? '✓ ' : e.type === 'checkIn' ? '· ' : '';
            const label   = prefix + esc(e.r.title) + (e.note ? ` (${esc(e.note)})` : '');
            const icon    = e.type === 'checkIn'  ? 'fa-bookmark'
                          : e.type === 'range'    ? 'fa-minus'
                          : e.type === 'end'      ? 'fa-flag-checkered'
                          : 'fa-play'; // start
            return `<div class="cal-item cat-${cc}${typeCls}"><i class="fa-solid ${icon}"></i><span title="${label}">${label}</span></div>`;
        }).join('') + (extra>0 ? `<div class="cal-more">+${extra} 条</div>` : '');

        cells += `<div class="${cls}" onclick="calDayClick('${ds}')"><div class="cal-date-num">${d}</div><div class="cal-items">${itemsHTML}</div></div>`;
    }

    const total = firstWD + dim;
    const tail  = total%7===0 ? 0 : 7-(total%7);
    for (let d=1; d<=tail; d++) {
        cells += `<div class="cal-cell other-month"><div class="cal-date-num">${d}</div></div>`;
    }

    document.getElementById('calGrid').innerHTML = headers + cells;
    adjustCalItemFonts();
}

function adjustCalItemFonts() {
    const STEP_PX = 1.2;   // px per "号"
    const MAX_STEPS = 5;
    const spans = document.querySelectorAll('#calGrid .cal-item span');
    // Batch-reset first
    spans.forEach(s => { s.style.fontSize = ''; });
    // Get base font size once
    const base = spans.length ? parseFloat(getComputedStyle(spans[0]).fontSize) : 10;
    // Progressively shrink each overflowing span
    spans.forEach(span => {
        for (let i = 1; i <= MAX_STEPS; i++) {
            if (span.scrollWidth <= span.clientWidth + 1) break;
            span.style.fontSize = (base - i * STEP_PX) + 'px';
        }
        // If still overflows after 5 steps, text-overflow:ellipsis handles it
    });
}

function calDayClick(dateStr) {
    const entries = calDateMap[dateStr] || [];
    const panel   = document.getElementById('calDayDetail');
    const body    = document.getElementById('calDdBody');
    document.getElementById('calDdTitle').textContent = dateStr;

    if (!entries.length) {
        body.innerHTML = `<div class="cal-dd-empty"><i class="fa-regular fa-calendar-xmark"></i> 当天无记录</div>`;
    } else {
        const typeLabel = { start:'开始', end:'完成', checkIn:'打卡', range:'进行中' };
        const typeIcon  = { start:'fa-play', end:'fa-flag-checkered', checkIn:'fa-bookmark', range:'fa-minus' };
        body.innerHTML = entries.map(e => `
            <div class="cal-dd-item">
                <span class="dd-badge dd-${e.type}"><i class="fa-solid ${typeIcon[e.type]||'fa-minus'}"></i> ${typeLabel[e.type]||''}</span>
                <span class="tag tag-${CAT_CLASS[e.r.category]||'movie'}" style="flex-shrink:0">${e.r.category}</span>
                <span class="dd-title">${esc(e.r.title)}</span>
                ${e.note?`<span class="dd-note">${esc(e.note)}</span>`:''}

    }
    panel.style.display = '';
}

function initImgUpload(base64) {

    if (currentImgBase64) {

        document.getElementById('imgEmpty').style.display   = 'none';
        document.getElementById('imgPreview').style.display = 'block';
    } else {
        document.getElementById('imgThumb').src = '';

        document.getElementById('imgPreview').style.display = 'none';
    }
    document.getElementById('imgFileInput').value = '';

function triggerImgSelect() { document.getElementById('imgFileInput').click(); }

function handleImgSelect(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 10 * 1024 * 1024) {
        showToast('图片超过 10MB，请选择更小的文件', 'error');
        e.target.value = '';
        return;
    }
    const reader = new FileReader();
    reader.onload = ev => {
        const img = new Image();
        img.onload = () => {
            // Compress: max 640px on longest side, JPEG 0.72 quality
            const MAX = 640;
            let w = img.width, h = img.height;
            if (w > MAX || h > MAX) {
                if (w >= h) { h = Math.round(h * MAX / w); w = MAX; }
                else        { w = Math.round(w * MAX / h); h = MAX; }
            }
            const cvs = document.createElement('canvas');
            cvs.width = w; cvs.height = h;
            cvs.getContext('2d').drawImage(img, 0, 0, w, h);
            currentImgBase64 = cvs.toDataURL('image/jpeg', 0.72);
            document.getElementById('imgThumb').src = currentImgBase64;
            document.getElementById('imgEmpty').style.display   = 'none';
            document.getElementById('imgPreview').style.display = 'block';
        };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    e.target.value = '';
}

function removeImg() {
    currentImgBase64 = '';
    document.getElementById('imgThumb').src = '';
    document.getElementById('imgEmpty').style.display   = '';
    document.getElementById('imgPreview').style.display = 'none';
}

/* ============================================================  GENRE SELECTOR  */
function setupGenreSelector() {
    const input = document.getElementById('genreInput');
    const box   = document.getElementById('genreInputBox');
    input.addEventListener('focus', () => { box.classList.add('focused'); refreshDropdown(); document.getElementById('genreDropdown').classList.remove('hidden'); });
    input.addEventListener('input', refreshDropdown);
    input.addEventListener('keydown', e => {
        if (e.key==='Enter') { e.preventDefault(); const v=input.value.trim(); if(v) addGenre(v); }
        else if (e.key==='Backspace' && !input.value && selectedGenres.length>0) { selectedGenres.pop(); renderChips(); refreshDropdown(); }
    });
    box.addEventListener('click', () => input.focus());
}

function initGenreSelector(initial) {
    selectedGenres = [...(initial||[])];
    renderChips();
    document.getElementById('genreInput').value = '';
    document.getElementById('genreDropdown').classList.add('hidden');
    document.getElementById('genreInputBox').classList.remove('focused');
}

function renderChips() {
    const container = document.getElementById('genreChips');
    container.innerHTML = selectedGenres.map((g, i) => `
        <span class="genre-chip">${esc(g)}<button type="button" class="genre-chip-del" data-idx="${i}" tabindex="-1"><i class="fa-solid fa-xmark"></i></button></span>
    `).join('');
    container.querySelectorAll('.genre-chip-del').forEach(btn => {
        btn.addEventListener('click', e => { e.stopPropagation(); selectedGenres.splice(parseInt(btn.dataset.idx),1); renderChips(); refreshDropdown(); });
    });
}

function addGenre(g) {
    g = g.trim();
    if (!g || selectedGenres.includes(g)) return;
    selectedGenres.push(g);
    if (!PREDEFINED_GENRES.includes(g) && !customGenres.includes(g)) {
        customGenres.push(g);
        localStorage.setItem(CUSTOM_GENRES_KEY, JSON.stringify(customGenres));
    }
    renderChips();
    document.getElementById('genreInput').value = '';
    refreshDropdown();
}

function refreshDropdown() {
    const q  = document.getElementById('genreInput').value.trim();
    const dd = document.getElementById('genreDropdown');
    const allGenres  = [...PREDEFINED_GENRES, ...customGenres.filter(g=>!PREDEFINED_GENRES.includes(g))];
    const available  = allGenres.filter(g => !selectedGenres.includes(g) && (!q||g.includes(q)));
    const canCustom  = q && !selectedGenres.includes(q) && !allGenres.includes(q);
    let html = available.map(g=>`<div class="genre-opt" data-genre="${esc(g)}">${esc(g)}</div>`).join('');
    if (canCustom) html += `<div class="genre-hint">按 Enter 添加「${esc(q)}」</div>`;
    if (!html)     html  = `<span class="genre-hint">${q?'无匹配，按 Enter 添加自定义':'可输入自定义题材后按 Enter'}</span>`;
    dd.innerHTML = html;
    dd.querySelectorAll('.genre-opt').forEach(el => { el.addEventListener('mousedown', e => { e.preventDefault(); addGenre(el.dataset.genre); }); });
}

document.addEventListener('click', e => {
    const sel = document.getElementById('genreSelector');
    if (sel && !sel.contains(e.target)) { document.getElementById('genreDropdown').classList.add('hidden'); document.getElementById('genreInputBox').classList.remove('focused'); }
    if (!document.getElementById('sortWrap')?.contains(e.target))  document.getElementById('sortPanel')?.classList.remove('open');
    if (!document.getElementById('groupWrap')?.contains(e.target)) document.getElementById('groupPanel')?.classList.remove('open');
});

function addCustomCompanion() {
    const input = document.getElementById('companionInput');
    const v = input.value.trim();
    if (!v) return;
    if (PREDEFINED_COMPANIONS.some(p => p.val === v || p.label === v) || customCompanions.includes(v)) {
        showToast('该选项已存在', 'error'); input.value = ''; return;
    }
    customCompanions.push(v);

function saveRecord(e) {
    e.preventDefault();
    const title      = document.getElementById('fTitle').value.trim();
    const category   = document.getElementById('fCat').value;
    const status     = document.getElementById('fStatus').value;
    const notes      = document.getElementById('fNotes').value.trim();
    const link       = document.getElementById('fLink').value.trim();
    const rating     = ratingTouched ? parseFloat(document.getElementById('fRating').value) : 0;
    const genres     = [...selectedGenres];
    const companions = [...selectedCompanions];
    const watchDates = getWatchDates();
    const checkIns   = getCheckIns();

    // Save image to IndexedDB; only store a flag in localStorage
    const rid = editingId || genId();
    let coverImg = '';
    if (currentImgBase64) {
        imgCache[rid] = currentImgBase64;
        saveImageToIDB(rid, currentImgBase64);
        coverImg = '__idb__';
    } else {
        deleteImageFromIDB(rid);
    }
    const payload  = { title, category, status, watchDates, checkIns, notes, link, rating, genres, companions, coverImg };

    if (editingId) {
        const idx = records.findIndex(r=>r.id===editingId);
        if (idx>-1) records[idx] = { ...records[idx], ...payload, updatedAt:Date.now() };
        showToast('记录已更新','success');
    } else {
        records.unshift({ id:rid, ...payload, createdAt:Date.now() });
        showToast('已添加新记录','success');
    }
    saveRecords(records);
    closeFormModal();
    renderStats();
    applyFilters();
}

function daysSince(dateStr) {
    if (!dateStr) return 0;
    const d = new Date(dateStr + 'T00:00:00');
    if (isNaN(d)) return 0;
    const now = new Date(); now.setHours(0,0,0,0); d.setHours(0,0,0,0);
    return Math.max(0, Math.floor((now - d) / 86400000));
}
function daysSinceMs(ms) {
    if (!ms) return 0;
    const d = new Date(ms); const now = new Date();
    now.setHours(0,0,0,0); d.setHours(0,0,0,0);
    return Math.max(0, Math.floor((now - d) / 86400000));
}

function getBacklogRecords() {
    return records.filter(r => {
        if (r.status !== '想看') return false;
        // Use earliest watchDate start if any, else createdAt
        const wd = (r.watchDates||[]).find(d => d.start);
        if (wd) return daysSince(wd.start) > 90;
        return r.createdAt ? daysSinceMs(r.createdAt) > 90 : false;
    });
}

function getStalledRecords() {
    return records.filter(r => {
        if (r.status !== '在看') return false;
        // Latest check-in date
        const checkIns = (r.checkIns||[]).filter(ci => ci.date);
        if (checkIns.length) {
            const latest = checkIns.map(ci => ci.date).sort().pop();
            return daysSince(latest) > 30;
        }
        // No check-ins: fall back to latest watchDate end/start
        const segs = (r.watchDates||[]).filter(d => d.start);
        if (segs.length) {
            const latestDate = segs.map(s => s.end || s.start).sort().pop();
            return daysSince(latestDate) > 30;
        }
        // No dates at all: use createdAt
        return r.createdAt ? daysSinceMs(r.createdAt) > 30 : false;
    });
}

function renderDashAlerts() {
    const backlog = getBacklogRecords();
    const stalled = getStalledRecords();
    const el = document.getElementById('dashAlertItems');

    const makeItem = (count, type, color, label, sub) => {

            : `<div class="dash-alert-num" onclick="activateAlertFilter('${type}')" title="点击筛选">${count}</div>`;
        return `<div class="dash-alert-item ${color}${zero ? ' dash-alert-item-ok' : ''}">
            ${numEl}
            <div class="dash-alert-text">
                <div class="dash-alert-label">${label}</div>
                <div class="dash-alert-sub">${sub}</div>
            </div>
        </div>`;
    };

    el.innerHTML =
        makeItem(backlog.length, 'backlog', 'yellow', '长期积压',

        makeItem(stalled.length, 'stalled', 'red',    '停滞在追',

}

/* ============================================================  MONTHLY CALENDAR  */
const VISUAL_CATS   = new Set(['电影','电视剧','综艺','短剧']);
const LITERARY_CATS = new Set(['小说','文章']);

function buildMonthActivityMap(year, month) {
    const dayData = {}; // date → {ids:Set, cats:Set}
    const dim     = new Date(year, month + 1, 0).getDate();
    const mStart  = `${year}-${pad(month + 1)}-01`;
    const mEnd    = `${year}-${pad(month + 1)}-${pad(dim)}`;

    records.forEach(r => {
        const addDs = (ds) => {
            if (!ds || ds < mStart || ds > mEnd) return;
            if (!dayData[ds]) dayData[ds] = { ids: new Set(), cats: new Set() };
            dayData[ds].ids.add(r.id);
            dayData[ds].cats.add(r.category);
        };
        (r.watchDates || []).filter(s => s.start).forEach(seg => {
            const segEnd  = seg.end || seg.start;
            const itStart = seg.start > mStart ? seg.start : mStart;
            const itEnd   = segEnd   < mEnd    ? segEnd    : mEnd;
            if (itStart > itEnd) return;
            let cur = new Date(itStart + 'T00:00:00');
            const endD = new Date(itEnd + 'T00:00:00');
            while (cur <= endD) { addDs(toDateStr(cur)); cur.setDate(cur.getDate() + 1); }
        });
        (r.checkIns || []).forEach(ci => addDs(ci.date || ''));
    });

    const map = {};
    Object.entries(dayData).forEach(([d, data]) => {
        map[d] = {
            count:       data.ids.size,
            hasVisual:   [...data.cats].some(c => VISUAL_CATS.has(c)),
            hasLiterary: [...data.cats].some(c => LITERARY_CATS.has(c)),
        };
    });
    return map;
}

function getDayCls(info) {
    if (!info || info.count === 0) return 'level-0';
    const lv = info.count === 1 ? 1 : info.count === 2 ? 2 : 3;
    const t  = (info.hasVisual && info.hasLiterary) ? 'm' : info.hasLiterary ? 'l' : 'v';
    return `lv-${t}${lv}`;
}

function renderDashMonthCal() {
    const year = dashCalYear, month = dashCalMonth;
    const curY = new Date().getFullYear();

    // Year select
    const ySel = document.getElementById('dashCalYearSel');
    if (ySel) {
        let yHTML = '';
        for (let y = curY - 4; y <= curY + 1; y++)
            yHTML += `<option value="${y}"${y === year ? ' selected' : ''}>${y}年</option>`;
        ySel.innerHTML = yHTML;
    }
    // Month select
    const mSel = document.getElementById('dashCalMonthSel');
    if (mSel) mSel.innerHTML = MONTH_ZH.map((m, i) =>
        `<option value="${i}"${i === month ? ' selected' : ''}>${m}</option>`).join('');

    const actData  = buildMonthActivityMap(year, month);
    const dim      = new Date(year, month + 1, 0).getDate();
    const firstWD  = new Date(year, month, 1).getDay();
    const todayStr = toDateStr(new Date());
    const mStart   = `${year}-${pad(month + 1)}-01`;
    const mEnd     = `${year}-${pad(month + 1)}-${pad(dim)}`;
    const getLevel = n => n === 0 ? 0 : n === 1 ? 1 : n === 2 ? 2 : 3; // 4 levels: 0/1/2/3+

    // Summary: count days per level
    const lvCnt = [0, 0, 0, 0];
    for (let d = 1; d <= dim; d++) {
        const ds = `${year}-${pad(month+1)}-${pad(d)}`;
        lvCnt[getLevel(actData[ds]?.count || 0)]++;
    }
    const activeDays = dim - lvCnt[0];
    const LV_LABELS = ['无记录','1条','2条','3+条'];
    const LV_COLORS = ['#eae6e2','#f5d0b8','#e08550','#b84e22'];
    let sumHTML = `<span class="mcal-sum-active">${activeDays}<span style="font-size:0.72rem;font-weight:400;color:var(--text-muted)"> / ${dim} 天活跃</span></span>`;
    lvCnt.forEach((cnt, i) => {
        sumHTML += `<span class="mcal-sum-item"><span class="mcal-sum-dot" style="background:${LV_COLORS[i]}"></span>${LV_LABELS[i]} <b style="color:var(--text)">${cnt}</b>天</span>`;
    });
    document.getElementById('dashCalSummary').innerHTML = sumHTML;

    // Calendar grid
    let html = ['日','一','二','三','四','五','六'].map(d => `<div class="mcal-day-header">${d}</div>`).join('');
    for (let i = 0; i < firstWD; i++) html += '<div class="mcal-cell mcal-empty"></div>';
    for (let d = 1; d <= dim; d++) {
        const ds   = `${year}-${pad(month + 1)}-${pad(d)}`;
        const info = actData[ds] || { count:0, hasVisual:false, hasLiterary:false };
        const cls  = getDayCls(info);
        const today = ds === todayStr ? ' mcal-today' : '';
        html += `<div class="mcal-cell ${cls}${today}" data-date="${ds}" data-count="${info.count}"><span class="mcal-date-num">${d}</span></div>`;
    }
    const gridEl = document.getElementById('dashMonthCalGrid');
    gridEl.innerHTML = html;
    // Let week rows stretch to fill the right-panel height equally
    const weekRows = Math.ceil((firstWD + dim) / 7);
    gridEl.style.gridTemplateRows = `auto ${'1fr '.repeat(weekRows).trimEnd()}`;
    gridEl.onmouseover = (e) => {
        const cell = e.target.closest('[data-date]');
        if (!cell) return;
        const cnt = parseInt(cell.dataset.count) || 0;
        showHeatmapTip(e, cnt > 0 ? `${cell.dataset.date}  ${cnt} 条活跃` : `${cell.dataset.date}  无记录`);
    };
    gridEl.onmousemove = posHeatmapTip;
    gridEl.onmouseleave = hideHeatmapTip;
    gridEl.onclick = (e) => {
        const cell = e.target.closest('[data-date]');
        if (!cell || parseInt(cell.dataset.count) === 0) return;
        showMcalDayPanel(cell.dataset.date);
    };

    // Legend
    const mkDots = (colors, labels) => labels.map((l,i) =>
        `<span class="mcal-sum-item"><span class="mcal-sum-dot" style="background:${colors[i]}"></span>${l}</span>`).join('');
    const V_C = ['#f5d0b8','#e08550','#b84e22'];
    const L_C = ['#c8def5','#4e96d0','#1a5ea8'];
    const M_C = ['#e2d0f8','#8c58d0','#5a24a8'];
    const LVS = ['1条','2条','3+条'];

    const catCnt = {};
    CATEGORIES.forEach(c => { catCnt[c] = 0; });
    records.forEach(r => {
        if (!(r.category in catCnt)) return;
        const active =
            (r.watchDates||[]).filter(s=>s.start).some(seg => { const se=seg.end||seg.start; return !(se < mStart || seg.start > mEnd); }) ||
            (r.checkIns||[]).some(ci => ci.date && ci.date >= mStart && ci.date <= mEnd);
        if (active) catCnt[r.category]++;
    });
    const activeCats = CATEGORIES.filter(c => catCnt[c] > 0);

/* ============================================================  TREND CHART  */
let trendSliderVal = -1; // -1 = uninitialized → will default to most-recent window

function getAllTrendMonths() {
    const now = new Date();
    let earliest = null;
    records.forEach(r => {
        (r.watchDates||[]).filter(s=>s.start).forEach(seg => {
            if (!earliest || seg.start < earliest) earliest = seg.start.substring(0,7);
        });
        (r.checkIns||[]).filter(ci=>ci.date).forEach(ci => {
            const m = ci.date.substring(0,7);
            if (!earliest || m < earliest) earliest = m;
        });
    });
    if (!earliest) {
        const d = new Date(now.getFullYear(), now.getMonth()-11, 1);
        earliest = `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
    }
    const curMonth = `${now.getFullYear()}-${pad(now.getMonth()+1)}`;
    const months = [];
    const d = new Date(earliest + '-01T00:00:00');
    while (true) {
        const y=d.getFullYear(), m=d.getMonth();
        const mStart=`${y}-${pad(m+1)}-01`, mEnd=`${y}-${pad(m+1)}-${pad(new Date(y,m+1,0).getDate())}`;
        const label=`${y}-${pad(m+1)}`;
        months.push({ label, count: records.filter(r => {
            const hasW=(r.watchDates||[]).filter(s=>s.start).some(seg=>{const se=seg.end||seg.start;return !(se<mStart||seg.start>mEnd);});
            const hasC=(r.checkIns||[]).some(ci=>ci.date&&ci.date>=mStart&&ci.date<=mEnd);
            return hasW||hasC;
        }).length });
        if (label >= curMonth) break;
        d.setMonth(d.getMonth()+1);
    }
    return months;
}

function renderDashTrendChart() {
    const allData   = getAllTrendMonths();
    const WINDOW    = 12;
    const maxOffset = Math.max(0, allData.length - WINDOW);

    // Slider
    const slider = document.getElementById('trendSlider');
    const wrap   = document.getElementById('trendSliderWrap');
    if (slider) {
        slider.max = maxOffset;
        if (trendSliderVal < 0) trendSliderVal = maxOffset; // default: most recent
        slider.value = Math.min(trendSliderVal, maxOffset);
        if (wrap) wrap.style.display = maxOffset > 0 ? '' : 'none';
        slider.oninput = () => { trendSliderVal = parseInt(slider.value); renderDashTrendChart(); };
    }

    const offset = slider ? parseInt(slider.value) : maxOffset;
    const data   = allData.slice(offset, offset + WINDOW);

    const startEl = document.getElementById('trendSliderStart');
    const endEl   = document.getElementById('trendSliderEnd');
    if (data.length && startEl) startEl.textContent = data[0].label;
    if (data.length && endEl)   endEl.textContent   = data[data.length-1].label;

    const c = initCanvas('chartTrend', 200); if(!c) return;
    const { ctx, W, H } = c;
    const pL=36, pR=48, pT=14, pB=30, cW=W-pL-pR, cH=H-pT-pB;
    const maxV = Math.max(...data.map(d=>d.count), 1);

    ctx.strokeStyle='#e8ddd4'; ctx.lineWidth=0.5;
    for(let i=0;i<=4;i++){
        const y=pT+cH*(1-i/4);
        ctx.beginPath();ctx.moveTo(pL,y);ctx.lineTo(W-pR,y);ctx.stroke();
        ctx.fillStyle='#a09080';ctx.font='9px sans-serif';ctx.textAlign='right';
        ctx.fillText(Math.round(maxV*i/4),pL-4,y+3);
    }
    if(!data.length) return;
    const denom = Math.max(data.length-1, 1);
    const pts = data.map((d,i)=>({ x:pL+(i/denom)*cW, y:pT+cH*(1-d.count/maxV) }));

    ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++){const cpx=(pts[i-1].x+pts[i].x)/2;ctx.bezierCurveTo(cpx,pts[i-1].y,cpx,pts[i].y,pts[i].x,pts[i].y);}
    ctx.lineTo(pts[pts.length-1].x,pT+cH); ctx.lineTo(pts[0].x,pT+cH); ctx.closePath();
    ctx.fillStyle='rgba(217,123,84,0.13)'; ctx.fill();

    ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++){const cpx=(pts[i-1].x+pts[i].x)/2;ctx.bezierCurveTo(cpx,pts[i-1].y,cpx,pts[i].y,pts[i].x,pts[i].y);}
    ctx.strokeStyle='#d97b54'; ctx.lineWidth=2; ctx.stroke();

    pts.forEach(p=>{
        ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);
        ctx.fillStyle='#d97b54';ctx.fill();
        ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
    });

    data.forEach((d,i)=>{
        if(i%2!==0 && i!==data.length-1) return;
        ctx.fillStyle='#a09080';ctx.font='9px sans-serif';ctx.textAlign='center';
        ctx.fillText(d.label, pts[i].x, H-pB+14);
    });
}

/* ============================================================  GENRE RADAR  */
let radarScale        = 1.0;
let radarDotPositions = []; // [{x,y,label,count,recs}]
let radarCache        = null; // {ctx,W,H} — reused on zoom to avoid canvas resize

function getGenreRadarData(maxN=8) {
    const counts={};
    records.forEach(r=>(r.genres||[]).forEach(g=>{counts[g]=(counts[g]||0)+1;}));
    return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,maxN)
        .map(([label,count])=>({label,count}));
}

function renderDashGenreRadar(zoomOnly=false) {
    const data = getGenreRadarData();
    const emptyEl = document.getElementById('genreRadarEmpty');
    if (!data.length) { if(emptyEl) emptyEl.style.display=''; return; }
    if (emptyEl) emptyEl.style.display='none';

    // Fixed 300×300 square canvas, centered via margin:auto — never resize on zoom
    if (!zoomOnly || !radarCache) {
        const canvas = document.getElementById('chartGenreRadar'); if(!canvas) return;
        const SIZE = 418, dpr = window.devicePixelRatio || 1;  // +10%
        canvas.width  = Math.round(SIZE * dpr);
        canvas.height = Math.round(SIZE * dpr);
        canvas.style.width  = SIZE + 'px';
        canvas.style.height = SIZE + 'px';
        const rctx = canvas.getContext('2d');
        rctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        radarCache = { ctx: rctx, W: SIZE, H: SIZE };
    }
    const { ctx, W, H } = radarCache;
    ctx.clearRect(0, 0, W, H);
    const cx=W/2, cy=176, n=data.length;
    // Cap maxR: labels extend ~50px beyond ring — must fit on all four sides
    const baseR = Math.min(W*0.30, H*0.30);
    const maxR  = Math.min(baseR * radarScale, cx - 52, cy - 52, H - cy - 52);
    const maxV  = Math.max(...data.map(d=>d.count), 1);
    const angs  = data.map((_,i)=>(2*Math.PI*i/n)-Math.PI/2);

    // Rings
    for (let ring=1; ring<=4; ring++) {
        const r=maxR*ring/4;
        ctx.beginPath();
        angs.forEach((a,i)=>{ const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
        ctx.closePath(); ctx.strokeStyle='#e0d8d0'; ctx.lineWidth=0.7; ctx.stroke();
    }
    // Spokes
    angs.forEach(a=>{
        ctx.beginPath(); ctx.moveTo(cx,cy);
        ctx.lineTo(cx+Math.cos(a)*maxR, cy+Math.sin(a)*maxR);
        ctx.strokeStyle='#e0d8d0'; ctx.lineWidth=0.7; ctx.stroke();
    });

    // Data polygon
    ctx.beginPath();
    data.forEach((d,i)=>{
        const r=maxR*(d.count/maxV),x=cx+Math.cos(angs[i])*r,y=cy+Math.sin(angs[i])*r;
        i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.closePath();
    ctx.fillStyle='rgba(217,123,84,0.18)'; ctx.fill();
    ctx.strokeStyle='#d97b54'; ctx.lineWidth=1.5; ctx.stroke();

    // Dots + store positions for click detection
    radarDotPositions = [];
    data.forEach((d,i)=>{
        const r=maxR*(d.count/maxV), x=cx+Math.cos(angs[i])*r, y=cy+Math.sin(angs[i])*r;
        ctx.beginPath(); ctx.arc(x,y,4.5,0,Math.PI*2);
        ctx.fillStyle='#d97b54'; ctx.fill();
        ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
        radarDotPositions.push({ x, y, label:d.label, count:d.count,
            recs: records.filter(r2=>(r2.genres||[]).includes(d.label)) });
    });

    // Labels with count value  (font +2 sizes: 10→12, 9→11)
    ctx.fillStyle='#4a3728'; ctx.font='12px -apple-system,sans-serif';
    data.forEach((d,i)=>{
        const a=angs[i], ca=Math.cos(a), sa=Math.sin(a);
        const lx=cx+ca*(maxR+19), ly=cy+sa*(maxR+19);
        ctx.textAlign   = Math.abs(ca)>0.2 ? (ca>0?'left':'right') : 'center';
        ctx.textBaseline= Math.abs(sa)>0.4 ? (sa>0?'top':'bottom') : 'middle';
        const lbl = d.label.length>5 ? d.label.slice(0,5)+'…' : d.label;
        ctx.fillText(`${lbl}`, lx, ly);
        // Count in primary color below/beside label
        ctx.fillStyle='#d97b54';
        ctx.font='bold 11px -apple-system,sans-serif';
        const cntX = lx;
        const cntY = ly + (Math.abs(sa)>0.4 ? (sa>0?15:-15) : 15);
        ctx.fillText(d.count, cntX, cntY);
        ctx.fillStyle='#4a3728'; ctx.font='12px -apple-system,sans-serif';
    });
    ctx.textBaseline='alphabetic';

    // Mouse wheel → zoom
    const canvas = document.getElementById('chartGenreRadar');
    canvas.onwheel = (e) => {
        e.preventDefault();
        radarScale = Math.max(0.5, Math.min(2.5, radarScale - e.deltaY * 0.0008));
        renderDashGenreRadar(true); // zoom-only: skip initCanvas, keep canvas size fixed
    };
    // Click → show works
    canvas.onclick = (e) => {
        const rect = canvas.getBoundingClientRect();
        const mx = (e.clientX - rect.left) * (W / rect.width);
        const my = (e.clientY - rect.top)  * (H / rect.height);
        const hit = radarDotPositions.find(dp => Math.hypot(dp.x-mx, dp.y-my) < 14);
        if (hit) showGenreWorksModal(hit);
    };
}

function showGenreWorksModal(hit) {
    document.getElementById('genreWorksModalTitle').textContent = `${hit.label} · ${hit.count} 部`;
    document.getElementById('genreWorksModalBody').innerHTML = hit.recs.length
        ? `<div class="rbucket-works">${hit.recs.map(r =>
            `<span class="rbucket-work-chip" onclick="hideModal('genreWorksModal');openDetailModal('${r.id}')">

    showModal('genreWorksModal');
}

/* ============================================================  PHOTO CALENDAR  */
let photoCalYear  = _now.getFullYear();
let photoCalMonth = _now.getMonth();

function _pcWatchDays(r) {
    return (r.watchDates || []).filter(s => s.start).reduce((n, seg) => {
        const s0 = new Date(seg.start + 'T00:00:00');
        const e0 = new Date((seg.end || seg.start) + 'T00:00:00');
        return n + Math.max(1, Math.floor((e0 - s0) / 86400000) + 1);
    }, 0);
}

function _pcDayRecs(ds) {
    return records.filter(r =>
        (r.watchDates || []).filter(s => s.start).some(seg => {
            const se = seg.end || seg.start;
            return ds >= seg.start && ds <= se;
        })
    );
}

function renderDashPhotoCal() {
    const year = photoCalYear, month = photoCalMonth;
    const dim     = new Date(year, month + 1, 0).getDate();
    const firstWD = new Date(year, month, 1).getDay();
    const today   = toDateStr(new Date());

    document.getElementById('photoCalMonthLbl').textContent = `${year} 年 ${MONTH_ZH[month]}`;

    const DAY_H = ['日','一','二','三','四','五','六'];
    let html = DAY_H.map(d => `<div class="pc-day-hdr">${d}</div>`).join('');

    for (let i = 0; i < firstWD; i++) html += '<div class="pc-cell pc-pad"></div>';

    const allMonthRecs = new Set();

    for (let d = 1; d <= dim; d++) {
        const ds   = `${year}-${pad(month+1)}-${pad(d)}`;
        const recs = _pcDayRecs(ds);
        recs.forEach(r => allMonthRecs.add(r.id));
        const isToday = ds === today;

            html += `<div class="pc-cell${todayCls}" onclick="showPhotoCalDay('${ds}')">

        // Pick record with fewest watch days
        const sorted  = [...recs].sort((a, b) => _pcWatchDays(a) - _pcWatchDays(b));
        const primary = sorted[0];
        const extra   = recs.length - 1;
        const img     = imgCache[primary.id];
        const cat     = primary.category;
        const title   = primary.title.length > 9 ? primary.title.slice(0, 8) + '…' : primary.title;

        const inner = img

        html += `<div class="pc-cell${todayCls}" onclick="showPhotoCalDay('${ds}')">
            ${inner}
            <div class="pc-overlay">
                <span class="pc-date">${d}</span>
                <span class="pc-title">${esc(title)}</span>
            </div>
            ${extra > 0 ? `<div class="pc-badge">+${extra}</div>` : ''}
        </div>`;
    }

    document.getElementById('photoCalGrid').innerHTML = html;

    // Stats row
    const catCnt = {};
    allMonthRecs.forEach(id => {
        const r = records.find(x => x.id === id);
        if (r) catCnt[r.category] = (catCnt[r.category] || 0) + 1;
    });
    const statsHTML = `<span style="font-weight:600;color:var(--text)">本月 ${allMonthRecs.size} 条记录</span>` +
        CATEGORIES.filter(c => catCnt[c]).map(c =>

        ).join('');
    document.getElementById('photoCalStats').innerHTML = statsHTML;

/* Draw a rounded-rect path only (no fill/stroke — caller decides) */
function _rrPath(ctx, x, y, w, h, r) {
    if (w <= 0 || h <= 0) return;
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x,     y + h, r);
    ctx.arcTo(x,     y + h, x,     y,     r);
    ctx.arcTo(x,     y,     x + w, y,     r);
    ctx.closePath();
}

/* Load an image from a data-URL and return an HTMLImageElement */
function _loadImg(src) {
    return new Promise(resolve => {
        const img = new Image();
        img.onload  = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
    });
}

/* Build the calendar canvas programmatically — no html2canvas needed */
async function _buildCalCanvas() {
    const year   = photoCalYear, month = photoCalMonth;
    const dim    = new Date(year, month + 1, 0).getDate();
    const firstWD = new Date(year, month, 1).getDay();
    const today  = toDateStr(new Date());

    const COL = 7, GAP = 4, PAD = 18;
    const ROWS    = Math.ceil((firstWD + dim) / 7);
    const CW      = 134, CH = 134;
    const TITLE_H = 52, HDR_H = 30, STATS_H = 36;
    const W = PAD * 2 + COL * CW + (COL - 1) * GAP;
    const H = PAD * 2 + TITLE_H + HDR_H + ROWS * CH + (ROWS - 1) * GAP + STATS_H;

    const DPR = 2;
    const canvas = document.createElement('canvas');
    canvas.width  = W * DPR;
    canvas.height = H * DPR;
    const ctx = canvas.getContext('2d');
    ctx.scale(DPR, DPR);

    // Background
    ctx.fillStyle = '#faf8f4';
    ctx.fillRect(0, 0, W, H);

    // Title
    ctx.fillStyle = '#4a3728';
    ctx.font = 'bold 18px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(`${year} 年 ${MONTH_ZH[month]} · 月度封面日历`, W / 2, PAD + TITLE_H / 2);

    // Day headers
    const DAY_LABELS = ['日','一','二','三','四','五','六'];
    ctx.font = '11px -apple-system,"PingFang SC",sans-serif';
    ctx.fillStyle = '#8a7060';
    DAY_LABELS.forEach((d, i) => {
        ctx.fillText(d, PAD + i * (CW + GAP) + CW / 2, PAD + TITLE_H + HDR_H / 2);
    });

    const allMonthRecs = new Set();

    for (let d = 1; d <= dim; d++) {
        const ds   = `${year}-${pad(month + 1)}-${pad(d)}`;
        const recs = _pcDayRecs(ds);
        recs.forEach(r => allMonthRecs.add(r.id));

        const idx  = firstWD + d - 1;
        const col  = idx % COL;
        const row  = Math.floor(idx / COL);
        const cx   = PAD + col * (CW + GAP);
        const cy   = PAD + TITLE_H + HDR_H + row * (CH + GAP);

        ctx.save();
        _rrPath(ctx, cx, cy, CW, CH, 6);
        ctx.clip();

        if (!recs.length) {
            ctx.fillStyle = '#eae6e2';
            ctx.fillRect(cx, cy, CW, CH);
        } else {
            const sorted  = [...recs].sort((a, b) => _pcWatchDays(a) - _pcWatchDays(b));
            const primary = sorted[0];
            const extra   = recs.length - 1;
            const cat     = primary.category;
            const imgSrc  = imgCache[primary.id];

            if (imgSrc) {
                const imgEl = await _loadImg(imgSrc);
                if (imgEl) {
                    const ar  = imgEl.naturalWidth / imgEl.naturalHeight;
                    const cAR = CW / CH;
                    let sx, sy, sw, sh;
                    if (ar > cAR) { sh = imgEl.naturalHeight; sw = sh * cAR; sx = (imgEl.naturalWidth - sw) / 2; sy = 0; }
                    else          { sw = imgEl.naturalWidth; sh = sw / cAR; sx = 0; sy = (imgEl.naturalHeight - sh) / 2; }
                    ctx.drawImage(imgEl, sx, sy, sw, sh, cx, cy, CW, CH);
                } else {
                    ctx.fillStyle = CAT_BG[cat] || '#eae6e2'; ctx.fillRect(cx, cy, CW, CH);
                }
            } else {
                ctx.fillStyle = CAT_BG[cat] || '#eae6e2'; ctx.fillRect(cx, cy, CW, CH);
                ctx.font = '36px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(DASH_ICON[cat] || '🎭', cx + CW / 2, cy + CH / 2);
            }

            // Overlay gradient
            const grd = ctx.createLinearGradient(cx, cy, cx, cy + CH);
            grd.addColorStop(0,   'rgba(0,0,0,0.48)');
            grd.addColorStop(0.4, 'rgba(0,0,0,0)');
            grd.addColorStop(0.6, 'rgba(0,0,0,0)');
            grd.addColorStop(1,   'rgba(0,0,0,0.52)');
            ctx.fillStyle = grd; ctx.fillRect(cx, cy, CW, CH);

            ctx.restore(); // unclip for text

            // Date number
            ctx.fillStyle = 'white';
            ctx.font = 'bold 11px -apple-system,sans-serif';
            ctx.textAlign = 'left'; ctx.textBaseline = 'top';
            ctx.fillText(String(d), cx + 5, cy + 4);

            // Record title
            const title = primary.title.length > 9 ? primary.title.slice(0, 8) + '…' : primary.title;
            ctx.font = '9px -apple-system,"PingFang SC",sans-serif';
            ctx.textBaseline = 'bottom'; ctx.fillStyle = 'rgba(255,255,255,0.92)';
            ctx.fillText(title, cx + 4, cy + CH - 4);

            // +N badge
            if (extra > 0) {
                const bt = `+${extra}`;
                ctx.font = 'bold 9px -apple-system,sans-serif';
                const bw = ctx.measureText(bt).width + 8;
                const bh = 14, bx = cx + CW - bw - 3, by = cy + CH - bh - 3;
                ctx.fillStyle = 'rgba(0,0,0,0.58)';
                _rrPath(ctx, bx, by, bw, bh, 6); ctx.fill();
                ctx.fillStyle = 'white'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(bt, bx + bw / 2, by + bh / 2);
            }
            continue; // already restored
        }
        ctx.restore();

        // Date for empty day
        ctx.fillStyle = '#9a8070';
        ctx.font = '11px -apple-system,sans-serif';
        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        ctx.fillText(String(d), cx + 5, cy + 4);

        // Today border
        if (today === ds) {
            ctx.strokeStyle = '#d97b54'; ctx.lineWidth = 2;
            _rrPath(ctx, cx + 1, cy + 1, CW - 2, CH - 2, 6); ctx.stroke();
        }
    }

    // Today border for cells with records (drawn AFTER clip is restored)
    for (let d = 1; d <= dim; d++) {
        const ds = `${year}-${pad(month + 1)}-${pad(d)}`;
        if (ds !== today || !_pcDayRecs(ds).length) continue;
        const idx = firstWD + d - 1;
        const cx  = PAD + (idx % COL) * (CW + GAP);
        const cy  = PAD + TITLE_H + HDR_H + Math.floor(idx / COL) * (CH + GAP);
        ctx.strokeStyle = '#d97b54'; ctx.lineWidth = 2.5;
        _rrPath(ctx, cx + 1.25, cy + 1.25, CW - 2.5, CH - 2.5, 6); ctx.stroke();
    }

    // Stats row
    const catCnt = {};
    allMonthRecs.forEach(id => { const r = records.find(x => x.id === id); if (r) catCnt[r.category] = (catCnt[r.category] || 0) + 1; });
    let sx = PAD;
    const sy = PAD + TITLE_H + HDR_H + ROWS * (CH + GAP) + 6;
    ctx.font = 'bold 12px -apple-system,"PingFang SC",sans-serif';
    ctx.fillStyle = '#4a3728'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    const totalText = `本月 ${allMonthRecs.size} 条记录`;
    ctx.fillText(totalText, sx, sy + 12);
    sx += ctx.measureText(totalText).width + 14;
    CATEGORIES.filter(c => catCnt[c]).forEach(c => {
        const t = `${c} ${catCnt[c]}`;
        ctx.font = '11px -apple-system,"PingFang SC",sans-serif';
        const tw = ctx.measureText(t).width, bw = tw + 14, bh = 20;
        ctx.fillStyle = CAT_BG[c] || '#eae6e2';
        _rrPath(ctx, sx, sy + 2, bw, bh, 10); ctx.fill();
        ctx.fillStyle = '#4a3728'; ctx.textAlign = 'center';
        ctx.fillText(t, sx + bw / 2, sy + 12);
        sx += bw + 8;
    });

    return canvas;
}
