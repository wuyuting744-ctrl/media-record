/* ============================================================  NETWORK GRAPH  */
let networkData    = null;
let networkHoverId = null;
let networkSelId   = null;

function buildNetworkData() {
    const recs  = records.slice(0, 80);
    const nodes = recs.map(r => ({
        id: r.id, title: r.title, category: r.category,
        rating: r.rating || 0, genres: r.genres || [],
        x: 0, y: 0, vx: 0, vy: 0
    }));
    const edges = [];
    for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
            const a = nodes[i], b = nodes[j];
            const shared = a.genres.filter(g => b.genres.includes(g));
            if (shared.length)
                edges.push({ from: a.id, to: b.id, byGenre: true, genres: shared });
        }
    }
    const idMap = {};
    nodes.forEach(nd => { idMap[nd.id] = nd; });
    return { nodes, edges, idMap };
}

function forceLayout(nodes, edges, W, H) {
    const n = nodes.length; if (n < 2) return;
    const k = Math.sqrt((W * H) / n) * 0.9;
    const ITER = Math.max(40, Math.min(120, Math.floor(4000 / n)));
    const idMap = {}; nodes.forEach(nd => { idMap[nd.id] = nd; });

    nodes.forEach((nd, i) => {
        const a = (2 * Math.PI * i) / n - Math.PI / 2;
        const r = Math.min(W, H) * 0.35;
        nd.x = W/2 + r*Math.cos(a); nd.y = H/2 + r*Math.sin(a);
        nd.vx = 0; nd.vy = 0;
    });

    for (let it = 0; it < ITER; it++) {
        const cool = 1 - it / ITER;
        for (let i = 0; i < n; i++) {
            let fx = 0, fy = 0;
            for (let j = 0; j < n; j++) {
                if (i === j) continue;
                const dx = nodes[i].x - nodes[j].x + 0.001, dy = nodes[i].y - nodes[j].y + 0.001;
                const d2 = dx*dx + dy*dy, d = Math.sqrt(d2) + 0.01;
                const f = k*k / d2; fx += dx/d*f; fy += dy/d*f;
            }
            nodes[i].vx = (nodes[i].vx + fx) * 0.55;
            nodes[i].vy = (nodes[i].vy + fy) * 0.55;
        }
        edges.forEach(e => {
            const a = idMap[e.from], b = idMap[e.to]; if (!a||!b) return;
            const dx = b.x-a.x, dy = b.y-a.y, d = Math.sqrt(dx*dx+dy*dy)+0.01, f = d/k*0.45;
            a.vx += dx/d*f; a.vy += dy/d*f; b.vx -= dx/d*f; b.vy -= dy/d*f;
        });
        const maxSpd = Math.max(6*cool, 0.5);
        nodes.forEach(nd => {
            nd.vx += (W/2 - nd.x)*0.002; nd.vy += (H/2 - nd.y)*0.002;
            const spd = Math.sqrt(nd.vx*nd.vx+nd.vy*nd.vy);
            if (spd > maxSpd) { nd.vx = nd.vx/spd*maxSpd; nd.vy = nd.vy/spd*maxSpd; }
            nd.x = Math.max(26, Math.min(W-26, nd.x+nd.vx));
            nd.y = Math.max(26, Math.min(H-26, nd.y+nd.vy));
        });
    }
}

function drawNetwork(W, H, dpr) {
    const canvas = document.getElementById('chartNetwork');
    if (!canvas || !networkData) return;
    const { nodes, edges, idMap } = networkData;
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    const activeId = networkSelId || networkHoverId;
    const nbrs = new Set();
    if (activeId) {
        nbrs.add(activeId);
        edges.forEach(e => {
            if (e.from === activeId) nbrs.add(e.to);
            if (e.to   === activeId) nbrs.add(e.from);
        });
    }

    edges.forEach(e => {
        const a = idMap[e.from], b = idMap[e.to]; if (!a||!b) return;
        const isAct = activeId && (e.from===activeId || e.to===activeId);
        const faded = activeId && !isAct;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = faded ? 'rgba(200,188,176,0.1)' :
                          isAct ? 'rgba(217,123,84,0.82)' : 'rgba(217,123,84,0.38)';
        ctx.lineWidth = isAct ? 3.2 : 1.6;
        ctx.stroke();
    });

    nodes.forEach(nd => {
        const isAct  = nd.id === activeId;
        const isNbr  = nbrs.has(nd.id) && !isAct;
        const faded  = activeId && !nbrs.has(nd.id);
        const r = isAct ? 9 : isNbr ? 8 : 6;
        ctx.globalAlpha = faded ? 0.16 : 1;
        ctx.beginPath(); ctx.arc(nd.x, nd.y, r, 0, Math.PI*2);
        ctx.fillStyle = CAT_BG[nd.category] || '#f0ece8'; ctx.fill();
        ctx.strokeStyle = isAct ? '#d97b54' : isNbr ? 'rgba(217,123,84,0.6)' : '#bfaf9f';
        ctx.lineWidth = isAct ? 2.2 : isNbr ? 1.4 : 0.8; ctx.stroke();
        if (!activeId || nbrs.has(nd.id)) {
            const lbl = nd.title.length > 7 ? nd.title.slice(0,6)+'…' : nd.title;
            ctx.font = `${isAct ? 600 : 400} ${isAct ? 11 : 9}px -apple-system,sans-serif`;
            ctx.fillStyle = isAct ? '#4a3728' : '#7a6858';
            ctx.textAlign = 'center';
            ctx.fillText(lbl, nd.x, nd.y + r + 10);
        }
        ctx.globalAlpha = 1;
    });
}

function renderDashNetwork() {
    networkData = buildNetworkData();
    networkHoverId = null; networkSelId = null;
    const canvas = document.getElementById('chartNetwork'); if (!canvas) return;
    const cardEl = canvas.parentElement;
    const PAD = 18; // .dash-card padding
    // W: subtract left+right padding so canvas has equal margins
    const W = Math.max((cardEl.clientWidth  || 400) - PAD * 2, 200);
    // H: fill the card minus title + legend + vertical padding
    const titleEl  = cardEl.querySelector('.dash-card-title');
    const legendEl = cardEl.querySelector('.net-legend');
    const usedH = (titleEl  ? titleEl.offsetHeight  + 8 : 50)
                + (legendEl ? legendEl.offsetHeight + 8 : 40)
                + PAD * 2;
    const cardH = cardEl.clientHeight || 0;
    const H = cardH > usedH + 100
        ? Math.max(cardH - usedH, 200)
        : Math.min(Math.max(W * 0.55, 260), 520);
    const dpr = window.devicePixelRatio || 1;
    canvas.width  = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    document.getElementById('networkInfo').style.display = 'none';

    const { nodes } = networkData;
    if (nodes.length < 2) {
        const ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
        ctx.fillStyle = '#a09080'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('至少需要 2 条带标签或评分的记录才能生成图谱', W/2, H/2);
        return;
    }
    forceLayout(nodes, networkData.edges, W, H);
    drawNetwork(W, H, dpr);

    canvas.onmousemove = (e) => {
        const rect = canvas.getBoundingClientRect();
        const mx = (e.clientX - rect.left) * (W / rect.width);
        const my = (e.clientY - rect.top)  * (H / rect.height);
        const hit = networkData.nodes.find(nd => Math.hypot(nd.x-mx, nd.y-my) < 13);
        if ((hit?.id||null) !== networkHoverId) { networkHoverId = hit?.id||null; drawNetwork(W, H, dpr); }
        canvas.style.cursor = hit ? 'pointer' : 'default';
        if (hit) showHeatmapTip(e, `《${hit.title}》 ${hit.category}${hit.rating>0?' · '+hit.rating+'分':''}`);
        else hideHeatmapTip();
    };
    canvas.onmouseleave = () => { networkHoverId = null; hideHeatmapTip(); drawNetwork(W, H, dpr); };
    canvas.onclick = (e) => {
        const rect = canvas.getBoundingClientRect();
        const mx = (e.clientX - rect.left) * (W / rect.width);
        const my = (e.clientY - rect.top)  * (H / rect.height);
        const hit = networkData.nodes.find(nd => Math.hypot(nd.x-mx, nd.y-my) < 13);
        if (hit) {
            networkSelId = hit.id !== networkSelId ? hit.id : null;
            drawNetwork(W, H, dpr);
            updateNetworkInfo();
        } else {
            // Click on empty space → open full-view modal
            networkSelId = null;
            drawNetwork(W, H, dpr);
            document.getElementById('networkInfo').style.display = 'none';
            showNetworkFullModal();
        }
    };
}

function updateNetworkInfo() {
    const el = document.getElementById('networkInfo');
    if (!networkSelId || !networkData) { el.style.display = 'none'; return; }
    const nd = networkData.idMap[networkSelId]; if (!nd) { el.style.display = 'none'; return; }
    const conn = networkData.edges.filter(e => e.from===networkSelId || e.to===networkSelId);
    const gCnt = {}; conn.filter(e=>e.byGenre).forEach(e => e.genres.forEach(g => { gCnt[g]=(gCnt[g]||0)+1; }));
    const topGenres = Object.entries(gCnt).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([g])=>g);
    let meta = `${conn.length} 条关联`;
    if (topGenres.length) meta += ` · 共同标签：${topGenres.join('、')}`;
    document.getElementById('networkInfoTitle').textContent = `《${nd.title}》`;
    document.getElementById('networkInfoMeta').textContent  = meta;
    el.dataset.topGenre = topGenres[0] || ''; el.dataset.category = nd.category;
    el.style.display = 'flex';
}

function filterByNetworkSel() {
    const el = document.getElementById('networkInfo');
    const g = el.dataset.topGenre;
    if (g) { filterGenreValue = g; document.getElementById('filterGenreInput').value = g; }
    else   { document.getElementById('filterCat').value = el.dataset.category || ''; }
    switchView('grid');
}

/* ── Network Full Modal (pan + hover + click) ── */
let _nfmNodes=[], _nfmEdges=[], _nfmIdMap={};
let _nfmPanX=0, _nfmPanY=0, _nfmHov=null, _nfmSel=null;
let _nfmFW=0, _nfmFH=0, _nfmDpr=1;

function showNetworkFullModal() {
    if (!networkData?.nodes?.length) return;
    _nfmPanX=0; _nfmPanY=0; _nfmHov=null; _nfmSel=null;
    showModal('networkFullModal');
    requestAnimationFrame(() => requestAnimationFrame(() => _initNfm()));
}

function _initNfm() {
    const fc = document.getElementById('chartNetworkFull'); if (!fc) return;
    const body = fc.parentElement;
    _nfmFW = Math.max(body.clientWidth||600, 300);
    _nfmFH = Math.max(body.clientHeight||400, 200);
    _nfmDpr = window.devicePixelRatio||1;
    fc.width  = Math.round(_nfmFW*_nfmDpr);
    fc.height = Math.round(_nfmFH*_nfmDpr);
    fc.style.width  = _nfmFW+'px';
    fc.style.height = _nfmFH+'px';
    _nfmNodes = networkData.nodes.map(n=>({...n,vx:0,vy:0}));
    _nfmEdges = networkData.edges;
    forceLayout(_nfmNodes, _nfmEdges, _nfmFW, _nfmFH);
    _nfmIdMap={}; _nfmNodes.forEach(n=>{ _nfmIdMap[n.id]=n; });
    _drawNfm();
    _setupNfmEvents(fc);
}

function _drawNfm() {
    const fc = document.getElementById('chartNetworkFull'); if (!fc) return;
    const ctx = fc.getContext('2d');
    ctx.setTransform(_nfmDpr,0,0,_nfmDpr,0,0);
    ctx.clearRect(0,0,_nfmFW,_nfmFH);
    ctx.save();
    ctx.translate(_nfmPanX, _nfmPanY);

    const aId = _nfmSel||_nfmHov;
    const nbrs = new Set();
    if (aId) { nbrs.add(aId); _nfmEdges.forEach(e=>{ if(e.from===aId)nbrs.add(e.to); if(e.to===aId)nbrs.add(e.from); }); }

    _nfmEdges.forEach(e=>{
        const a=_nfmIdMap[e.from], b=_nfmIdMap[e.to]; if(!a||!b) return;
        const isAct=aId&&(e.from===aId||e.to===aId), faded=aId&&!isAct;
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
        ctx.strokeStyle=faded?'rgba(216,180,148,0.08)':isAct?'rgba(216,180,148,0.85)':'rgba(216,180,148,0.42)';
        ctx.lineWidth=isAct?3.5:1.76; ctx.stroke();
    });

    _nfmNodes.forEach(nd=>{
        const isAct=nd.id===aId, isNbr=nbrs.has(nd.id)&&!isAct, faded=aId&&!nbrs.has(nd.id);
        const r=isAct?11:isNbr?9:8;
        ctx.globalAlpha=faded?0.16:1;
        ctx.beginPath(); ctx.arc(nd.x,nd.y,r,0,Math.PI*2);
        ctx.fillStyle=CAT_BG[nd.category]||'#f0ece8'; ctx.fill();
        ctx.strokeStyle=isAct?'rgba(216,180,148,0.9)':'rgba(216,180,148,0.55)';
        ctx.lineWidth=isAct?2.5:1.3; ctx.stroke();
        if (!aId||nbrs.has(nd.id)) {
            const lbl=nd.title.length>9?nd.title.slice(0,8)+'…':nd.title;
            ctx.fillStyle='#2c2010';
            ctx.font=(isAct?'bold ':'')+' 13px -apple-system,sans-serif';
            ctx.textAlign='center'; ctx.textBaseline='top';
            ctx.fillText(lbl,nd.x,nd.y+r+4);
        }
        ctx.globalAlpha=1;
    });
    ctx.restore(); ctx.textBaseline='alphabetic';
}

function _setupNfmEvents(fc) {
    fc.onmousemove=fc.onmousedown=fc.onmouseup=fc.onmouseleave=fc.onclick=fc.onwheel=null;
    let panning=false, lx=0, ly=0, dragged=false;
    const toWorld=e=>{
        const r=fc.getBoundingClientRect();
        return {x:(e.clientX-r.left)*(_nfmFW/r.width)-_nfmPanX,
                y:(e.clientY-r.top)*(_nfmFH/r.height)-_nfmPanY};
    };
    fc.onmousedown=e=>{ panning=true; dragged=false; lx=e.clientX; ly=e.clientY; };
    fc.onmousemove=e=>{
        if (panning) {
            const dx=e.clientX-lx, dy=e.clientY-ly;
            if (Math.abs(dx)+Math.abs(dy)>2) dragged=true;
            _nfmPanX+=dx; _nfmPanY+=dy; lx=e.clientX; ly=e.clientY; _drawNfm(); return;
        }
        const {x,y}=toWorld(e);
        const hit=_nfmNodes.find(n=>Math.hypot(n.x-x,n.y-y)<14);
        if ((hit?.id||null)!==_nfmHov) { _nfmHov=hit?.id||null; _drawNfm(); }
        fc.style.cursor=hit?'pointer':'grab';
        if (hit) showHeatmapTip(e,`《${hit.title}》 ${hit.category}${hit.rating>0?' · '+hit.rating+'分':''}`);
        else hideHeatmapTip();
    };
    fc.onmouseup=()=>{ panning=false; fc.style.cursor='grab'; };
    fc.onclick=e=>{
        if (dragged){ dragged=false; return; }
        const {x,y}=toWorld(e);
        const hit=_nfmNodes.find(n=>Math.hypot(n.x-x,n.y-y)<14);
        _nfmSel=hit&&hit.id!==_nfmSel?hit.id:null;
        _drawNfm();
    };
    fc.onmouseleave=()=>{ panning=false; _nfmHov=null; hideHeatmapTip(); _drawNfm(); fc.style.cursor='grab'; };
    fc.onwheel=e=>{ e.preventDefault(); _nfmPanX-=e.deltaX; _nfmPanY-=e.deltaY; _drawNfm(); };
    fc.style.cursor='grab';
}

function clearNetworkSel() {
    networkSelId = null;
    if (networkData) {
        const c = document.getElementById('chartNetwork');
        if (c) { const W=parseInt(c.style.width), H=parseInt(c.style.height), dpr=window.devicePixelRatio||1; drawNetwork(W,H,dpr); }
    }
    document.getElementById('networkInfo').style.display = 'none';
}

function showHeatmapTip(e, text) {
    const tip = document.getElementById('heatmapTooltip');
    tip.textContent = text;
    tip.style.display = 'block';
    posHeatmapTip(e);
}
function posHeatmapTip(e) {
    const tip = document.getElementById('heatmapTooltip');
    if (tip.style.display !== 'block') return;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.min(e.clientX + 14, window.innerWidth  - tw - 8) + 'px';
    tip.style.top  = (e.clientY > th + 14 ? e.clientY - th - 8 : e.clientY + 14) + 'px';
}
function hideHeatmapTip() { document.getElementById('heatmapTooltip').style.display = 'none'; }

/* ============================================================  DASHBOARD  */
let dashPeriod      = 'month';
let dashCalYear     = _now.getFullYear();
let dashCalMonth    = _now.getMonth();
let dashDetailYear  = _now.getFullYear();
let dashDetailMonth = _now.getMonth();   // -1 = full year
let dashMonthYear   = _now.getFullYear();
let dashMonthMonth  = _now.getMonth();

const CAT_BG    = {
    '电影':  'rgba(212,168,168,0.45)',  /* 玫瑰粉   */
    '电视剧':'rgba(200,168,212,0.45)',  /* 薰衣草紫 */
    '综艺':  'rgba(244,232,168,0.55)',  /* 柠黄     */
    '短剧':  'rgba(216,180,148,0.48)',  /* 蜜桃橙   */
    '小说':  'rgba(168,200,180,0.48)',  /* 薄荷绿   */
    '文章':  'rgba(168,196,224,0.50)',  /* 柔蓝     */
};
const DASH_ICON = {'电影':'🎬','电视剧':'📺','综艺':'⭐','短剧':'📱','小说':'📖','文章':'📰'};

function toDateStr(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

function roundRectFill(ctx,x,y,w,h,r){
    if(h<=0||w<=0) return; r=Math.min(r,w/2,h/2);
    ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); ctx.fill();
}

function initCanvas(id,h){
    const canvas=document.getElementById(id); if(!canvas) return null;
    const W=Math.max((canvas.parentElement?.clientWidth||400)-0,200);
    const dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(W*dpr); canvas.height=Math.round(h*dpr);
    canvas.style.width=W+'px'; canvas.style.height=h+'px';
    const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr);
    return {ctx,W,H:h};
}

/* helpers for period range */
function getPeriodRange(period) {
    const now = new Date();
    if (period==='week') {
        const day=now.getDay(), monday=new Date(now);
        monday.setDate(now.getDate()-(day===0?6:day-1));
        const sunday=new Date(monday); sunday.setDate(monday.getDate()+6);
        return {s:toDateStr(monday), e:toDateStr(sunday)};
    } else if (period==='month') {
        return {s:`${now.getFullYear()}-${pad(now.getMonth()+1)}-01`, e:`${now.getFullYear()}-${pad(now.getMonth()+1)}-31`};
    } else {
        return {s:`${now.getFullYear()}-01-01`, e:`${now.getFullYear()}-12-31`};
    }
}

function recordsInRange(s, e) {
    return records.filter(r =>
        (r.watchDates||[]).some(seg => { if(!seg.start) return false; const ed=seg.end||seg.start; return seg.start<=e&&ed>=s; })
        || (r.checkIns||[]).some(ci => ci.date&&ci.date>=s&&ci.date<=e)
    );
}

/* main render */
function renderDashStatusChart() {
    const total = records.length;
    if (!total) return;
    const done     = records.filter(r => r.status === '看过').length;
    const want     = records.filter(r => r.status === '想看').length;
    const watching = records.filter(r => r.status === '在看').length;

    const segs = [
        { label:'看过', count:done,     color:'#8ec8a0' },  // 浅绿色
        { label:'想看', count:want,     color:'#90b8e0' },  // 浅蓝色
        { label:'在看', count:watching, color:'#e8a870' },  // 浅橙色
    ].filter(s => s.count > 0);
    if (!segs.length) return;

    const c = initCanvas('chartStatus', 210);
    if (!c) return;
    const { ctx, W, H } = c;
    const cx = W / 2, cy = H * 0.50;
    // Cap outerR to ensure labels (±16px beyond ring) stay inside canvas on all sides
    const outerR = Math.min(W * 0.18, cy - 22, H - cy - 22);
    const innerR = outerR * 0.60;

    // Donut segments
    let ang = -Math.PI / 2;
    segs.forEach(s => {
        const sw = (s.count / total) * Math.PI * 2;
        s.startAngle = ang; s.endAngle = ang + sw; s.midAngle = ang + sw / 2;
        ang += sw;
        ctx.beginPath();
        ctx.arc(cx, cy, outerR, s.startAngle, s.endAngle);
        ctx.arc(cx, cy, innerR, s.endAngle, s.startAngle, true);
        ctx.closePath();
        ctx.fillStyle = s.color; ctx.fill();
    });
    // White separators
    if (segs.length > 1) {
        ang = -Math.PI / 2;
        segs.forEach(s => {
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(ang)*innerR, cy + Math.sin(ang)*innerR);
            ctx.lineTo(cx + Math.cos(ang)*outerR, cy + Math.sin(ang)*outerR);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
            ang += (s.count / total) * Math.PI * 2;
        });
    }
    // Center text — 30% smaller, vertically centered in ring using textBaseline:'middle'
    const nfs = Math.round(outerR * 0.39); // 0.56 × 0.7 ≈ 0.39
    const sfs = Math.round(nfs * 0.52);
    const gap = 4;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#4a3728';
    ctx.font = `bold ${nfs}px -apple-system,sans-serif`;
    ctx.fillText(total, cx, cy - gap / 2 - sfs / 2);   // number: upper half
    ctx.fillStyle = '#9a8070';
    ctx.font = `${sfs}px -apple-system,sans-serif`;
    ctx.fillText('合计', cx, cy + gap / 2 + nfs / 2);  // label: lower half
    ctx.textBaseline = 'alphabetic'; // restore default
    // External labels with pointer lines
    segs.forEach(s => {
        const pct = (s.count / total * 100).toFixed(1);
        const mx = Math.cos(s.midAngle), my = Math.sin(s.midAngle);
        const x1 = cx + mx*(outerR+5),  y1 = cy + my*(outerR+5);
        const x2 = cx + mx*(outerR+16), y2 = cy + my*(outerR+16);
        const isRight = mx >= 0;
        const x3 = x2 + (isRight ? 14 : -14);
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y2);
        ctx.strokeStyle = s.color; ctx.lineWidth = 1.2; ctx.stroke();
        ctx.fillStyle = '#4a3728';
        ctx.font = '11px -apple-system,sans-serif';
        ctx.textAlign = isRight ? 'left' : 'right';
        ctx.fillText(`${s.label} ${s.count} (${pct}%)`, x3 + (isRight?3:-3), y2 + 3.5);
    });
}

function renderDashboard() {
    renderDashAlerts();
    renderDashMonthCats();
    renderDashStatusMatrix();
    renderDashTopRated();
    renderDashDetailCards();
    renderDashRatingChart();
    renderDashMonthCal();
    renderDashTrendChart();
    renderDashGenreRadar();
    renderDashNetwork();
}

/* 1. Monthly record by category */
function renderDashMonthCats() {
    const curY = new Date().getFullYear();
    // Populate year select
    const ySel = document.getElementById('dashMonthYearSel');
    if (ySel) {
        ySel.innerHTML = '';
        for (let y = curY - 4; y <= curY + 1; y++)
            ySel.innerHTML += `<option value="${y}"${y===dashMonthYear?' selected':''}>${y}年</option>`;
    }
    // Populate month select
    const mSel = document.getElementById('dashMonthMonthSel');
    if (mSel) mSel.innerHTML = MONTH_ZH.map((m, i) =>
        `<option value="${i}"${i===dashMonthMonth?' selected':''}>${m}</option>`).join('');

    const dim = new Date(dashMonthYear, dashMonthMonth + 1, 0).getDate();
    const s = `${dashMonthYear}-${pad(dashMonthMonth + 1)}-01`;
    const e = `${dashMonthYear}-${pad(dashMonthMonth + 1)}-${pad(dim)}`;
    const monthRecs = recordsInRange(s, e);

    document.getElementById('dashMonthCats').innerHTML = CATEGORIES.map(c => {
        const n = monthRecs.filter(r => r.category === c).length;
        return `<div class="dash-month-cat" style="background:${CAT_BG[c]||'#f0ece8'}">
            <div class="dash-month-cat-num">${n}</div>
            <div class="dash-month-cat-lbl">${c}</div>
        </div>`;
    }).join('');
}

function onDashMonthChange() {
    dashMonthYear  = parseInt(document.getElementById('dashMonthYearSel').value);
    dashMonthMonth = parseInt(document.getElementById('dashMonthMonthSel').value);
    renderDashMonthCats();
    renderDashDetailCards();
}

/* 2. Status × category matrix */
function renderDashStatusMatrix() {
    const data=CATEGORIES.map(c=>({
        c,
        want:records.filter(r=>r.category===c&&r.status==='想看').length,
        watching:records.filter(r=>r.category===c&&r.status==='在看').length,
        done:records.filter(r=>r.category===c&&r.status==='看过').length,
    })).filter(d=>d.want||d.watching||d.done);
    if(!data.length){document.getElementById('dashStatusMatrix').innerHTML='<div style="color:var(--text-muted);font-size:0.82rem;padding:8px 0">暂无数据</div>';return;}
    const cell=(n,cls)=>n>0?`<td class="${cls}">${n}</td>`:`<td class="sn-zero">—</td>`;
    document.getElementById('dashStatusMatrix').innerHTML=`
        <table class="status-matrix">
            <thead><tr><th>类别</th><th>想看</th><th>在看</th><th>看过</th></tr></thead>
            <tbody>${data.map(d=>`<tr>
                <td style="font-size:0.72rem;font-weight:600;color:var(--text)">${d.c}</td>
                ${cell(d.want,'sn-want')}${cell(d.watching,'sn-watching')}${cell(d.done,'sn-done')}
            </tr>`).join('')}</tbody>
        </table>`;
}

/* 3. Top rated */
function renderDashTopRated() {
    const el = document.getElementById('dashTopRated');
    let cols = '';
    CATEGORIES.forEach(cat => {
        const best = records.filter(r => r.category === cat && r.rating > 0)
            .reduce((b, r) => (!b || r.rating > b.rating) ? r : b, null);
        const tag = `<span class="tag tag-${CAT_CLASS[cat]||'movie'}" style="font-size:0.62rem;padding:2px 7px;text-align:center;display:block">${cat}</span>`;
        const ph  = `<div class="toprated-col-ph" style="background:${CAT_BG[cat]||'#f0ece8'}">${DASH_ICON[cat]||'🎭'}</div>`;
        if (!best) {
            cols += `<div class="toprated-col toprated-col-no-rating">
                ${tag}${ph}
                <div class="toprated-col-empty">暂无评分</div>
            </div>`;
        } else {
            const poster = imgCache[best.id]
                ? `<img src="${imgCache[best.id]}" class="toprated-col-img" alt="封面">` : ph;
            cols += `<div class="toprated-col" onclick="openDetailModal('${best.id}')">
                ${tag}${poster}
                <div class="toprated-col-title" title="${esc(best.title)}">${esc(best.title)}</div>
                <div class="toprated-col-score">${best.rating} 分</div>
                <div class="toprated-col-stars">${starsHTML(best.rating)}</div>
            </div>`;
        }
    });
    el.innerHTML = `<div class="dash-card-title">各类最高评分</div><div class="toprated-cols">${cols}</div>`;
}

/* 4. Period detail cards — uses shared dashMonthYear/dashMonthMonth */
function renderDashDetailCards() {
    // Compute date range from shared month state
    const dim = new Date(dashMonthYear, dashMonthMonth + 1, 0).getDate();
    const s = `${dashMonthYear}-${pad(dashMonthMonth + 1)}-01`;
    const e = `${dashMonthYear}-${pad(dashMonthMonth + 1)}-${pad(dim)}`;

    const recs = recordsInRange(s, e);
    const el   = document.getElementById('dashDetailCards');
    if (!recs.length) {
        el.innerHTML = `<div class="dash-detail-empty">${dashMonthYear}年${MONTH_ZH[dashMonthMonth]}暂无记录</div>`;
        return;
    }
    el.innerHTML = recs.map(r => {
        const poster = imgCache[r.id] ? `<img src="${imgCache[r.id]}" class="detail-pcard-img" alt="封面">`
            : `<div class="detail-pcard-ph" style="background:${CAT_BG[r.category]||'#f0ece8'}">${DASH_ICON[r.category]||'🎭'}</div>`;
        const rating = r.rating > 0 ? `<div class="detail-pcard-score">${r.rating} 分</div>` : '';
        return `<div class="detail-pcard" onclick="openDetailModal('${r.id}')">
            ${poster}
            <div class="detail-pcard-body">
                <div class="detail-pcard-title">${esc(r.title)}</div>
                <span class="detail-pcard-cat tag tag-${CAT_CLASS[r.category]||'movie'}">${r.category}</span>
                ${rating}
            </div>
        </div>`;
    }).join('');
}

function onDashDetailChange() {
    dashDetailYear  = parseInt(document.getElementById('dashDetailYearSel').value);
    dashDetailMonth = parseInt(document.getElementById('dashDetailMonthSel').value);
    renderDashDetailCards();
}

/* 5. Rating distribution bar chart */
function renderDashRatingChart() {
    const buckets=[
        {label:'0–2', min:0.01,max:2,    color:'rgba(216,180,148,0.30)'},   /* 极浅蜜桃 */
        {label:'2–4', min:2,   max:4,    color:'rgba(216,180,148,0.58)'},   /* 浅蜜桃   */
        {label:'4–6', min:4,   max:6,    color:'rgba(212,168,168,0.55)'},   /* 浅玫瑰   */
        {label:'6–8', min:6,   max:8,    color:'rgba(212,168,168,0.78)'},   /* 玫瑰     */
        {label:'8–10',min:8,   max:10.1, color:'rgba(196,136,136,0.95)'},   /* 深玫瑰   */
        {label:'未评分',color:'rgba(216,180,148,0.18)'},                    /* 极浅蜜桃 */
    ];
    buckets.forEach((b,i)=>{
        b.count = b.label==='未评分' ? records.filter(r=>!r.rating||r.rating===0).length
                                     : records.filter(r=>r.rating>0&&r.rating>=b.min&&r.rating<b.max).length;
    });
    const c=initCanvas('chartRating',160); if(!c) return;
    const {ctx,W,H}=c, pL=30,pR=8,pT=16,pB=28, cW=W-pL-pR, cH=H-pT-pB;
    const max=Math.max(...buckets.map(b=>b.count),1), n=buckets.length, slotW=cW/n, barW=slotW*0.65;
    ctx.strokeStyle='#e8ddd4'; ctx.lineWidth=0.5;
    for(let i=0;i<=4;i++){const y=pT+cH*(1-i/4);ctx.beginPath();ctx.moveTo(pL,y);ctx.lineTo(W-pR,y);ctx.stroke();if(i){ctx.fillStyle='#a09080';ctx.font='9px sans-serif';ctx.textAlign='right';ctx.fillText(Math.round(max*i/4),pL-3,y+3);}}
    buckets.forEach((b,i)=>{
        const x=pL+slotW*i+(slotW-barW)/2, bH=max>0?(b.count/max)*cH:0, y=pT+cH-bH;
        ctx.fillStyle=b.color; roundRectFill(ctx,x,y,barW,bH,3);
        if(b.count){ctx.fillStyle=b.count&&b.count>0?'#2c2010':'#9a8068';ctx.font='bold 11px -apple-system,sans-serif';ctx.textAlign='center';ctx.fillText(b.count,x+barW/2,y-4);}
        ctx.fillStyle='#9a8068';ctx.font='11px -apple-system,sans-serif';ctx.textAlign='center';ctx.fillText(b.label,x+barW/2,H-pB+14);
    });
    // Click handler: detect which bucket slot was clicked
    const canvas = document.getElementById('chartRating');
    canvas.onclick = function(e) {
        const cx = e.offsetX;
        for (let i = 0; i < buckets.length; i++) {
            const sx = pL + slotW * i;
            if (cx >= sx && cx < sx + slotW) { showRatingBucketModal(buckets[i]); return; }
        }
    };
}

function showRatingBucketModal(bucket) {
    if (!bucket.count) { showToast('该评分段暂无作品'); return; }
    const works = bucket.label === '未评分'
        ? records.filter(r => !r.rating || r.rating === 0)
        : records.filter(r => r.rating > 0 && r.rating >= bucket.min && r.rating < bucket.max);
    if (!works.length) return;
    const grouped = {};
    works.forEach(r => { if (!grouped[r.category]) grouped[r.category] = []; grouped[r.category].push(r); });
    document.getElementById('ratingBucketTitle').textContent = `评分 ${bucket.label} · 共 ${works.length} 部`;
    let html = '';
    CATEGORIES.forEach(cat => {
        if (!grouped[cat]) return;
        html += `<div class="rbucket-cat-group">
            <span class="tag tag-${CAT_CLASS[cat]||'movie'}" style="font-size:0.65rem;padding:2px 8px">${esc(cat)}</span>
            <div class="rbucket-works">
                ${grouped[cat].map(r =>
                    `<span class="rbucket-work-chip" onclick="hideModal('ratingBucketModal');openDetailModal('${r.id}')">
                        ${esc(r.title)}${r.rating>0?`<span class="rbucket-work-score">${r.rating}</span>`:''}
                    </span>`
                ).join('')}
            </div>
        </div>`;
    });
    document.getElementById('ratingBucketBody').innerHTML = html || '<div style="color:var(--text-muted);font-size:0.85rem">暂无作品</div>';
    showModal('ratingBucketModal');
}

let _toastTimer;
function showToast(msg,type='') {
    const t=document.getElementById('toast'); t.textContent=msg; t.className='toast '+type; t.classList.add('show');
    clearTimeout(_toastTimer); _toastTimer=setTimeout(()=>t.classList.remove('show'),2800);
}

/* ============================================================  DASHBOARD GRID  */
let dashGrid = null;
const DASH_LAYOUT_KEY = 'dashGridLayout_v2';

function initDashGrid() {
    if (typeof GridStack === 'undefined' || window._gsError || dashGrid) return;

    dashGrid = GridStack.init({
        column: 12,
        cellHeight: 40,
        animate: true,
        handle: '.dash-card-title',
        margin: 10,
        minRow: 1,
        float: false,
        resizable: { handles: 'n,ne,e,se,s,sw,w,nw' },
    }, '#dashGrid');

    // Re-render charts on resize
    dashGrid.on('resizestop', (_e, el) => {
        const mid = el.querySelector('[data-mid]')?.dataset.mid;
        if (mid) setTimeout(() => rerenderDashModule(mid), 60);
    });

    // ResizeObserver: also catches initial gridstack layout & programmatic changes
    if ('ResizeObserver' in window) {
        let _roTimer = null;
        const _ro = new ResizeObserver(entries => {
            clearTimeout(_roTimer);
            _roTimer = setTimeout(() => {
                entries.forEach(entry => {
                    const mid = entry.target.querySelector('[data-mid]')?.dataset.mid;
                    if (mid) rerenderDashModule(mid);
                });
            }, 80);
        });
        document.querySelectorAll('#dashGrid .grid-stack-item-content').forEach(el => _ro.observe(el));
    }

    // Save layout on any change
    dashGrid.on('change', () => {
        try {
            const items = dashGrid.engine.nodes.map(n => ({
                id: n.el?.id || '', x:n.x, y:n.y, w:n.w, h:n.h
            })).filter(n => n.id);
            localStorage.setItem(DASH_LAYOUT_KEY, JSON.stringify(items));
            document.getElementById('dashResetLayout')?.classList.add('visible');
        } catch {}
    });

    // Restore saved layout
    try {
        const saved = JSON.parse(localStorage.getItem(DASH_LAYOUT_KEY) || 'null');
        if (saved?.length) {
            saved.forEach(item => {
                const el = document.getElementById(item.id);
                if (el) dashGrid.update(el, {x:item.x, y:item.y, w:item.w, h:item.h});
            });
            document.getElementById('dashResetLayout')?.classList.add('visible');
        }
    } catch {}
}

function rerenderDashModule(mid) {
    switch (mid) {
        case 'alerts':   renderDashAlerts(); break;
        case 'monthly':  renderDashMonthCats(); renderDashDetailCards(); break;
        case 'status':   renderDashStatusMatrix(); break;
        case 'toprated': renderDashTopRated(); break;
        case 'rating':   renderDashRatingChart(); break;
        case 'mcal':     renderDashMonthCal(); break;
        case 'trend':    renderDashTrendChart(); break;
        case 'radar':    radarCache = null; renderDashGenreRadar(); break;
        case 'network':  renderDashNetwork(); break;
    }
}

function resetDashLayout() {
    localStorage.removeItem(DASH_LAYOUT_KEY);
    document.getElementById('dashResetLayout')?.classList.remove('visible');
    // Reload page to restore default positions
    location.reload();
}

/* ============================================================  START  */
init();
